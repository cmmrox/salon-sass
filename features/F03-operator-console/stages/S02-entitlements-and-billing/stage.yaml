    infra/scripts/local-up.sh   (PostgreSQL 5440, API 8090, web 3100); after a rebuild: infra/scripts/local-service.sh stop|start api|web.
    Console: http://console.localhost:3100/console/salons/{id} (subscription card) and /console/salons/{id}/invoices.
    Workspace: http://<slug>.localhost:3100/workspace/billing (Owner) and the billing banner on every /workspace page.
    Operator API (console host only): GET|POST|PATCH /api/v1/operator/salons/{id}/subscription (POST: Idempotency-Key, {monthlyAmount,paymentMethod,currency?});
      PUT /salons/{id}/plan {version,planId}; GET /salons/{id}/invoices?page&size; GET /invoices/{id}; POST /invoices/{id}/payments (Idempotency-Key,
      {reference,amount,receivedOn}); POST /salons now requires subscription:{monthlyAmount,paymentMethod}; salon detail gains version.
    Salon API (staff on the salon host): GET /api/v1/salon/entitlements (entitlement.read: every staff role), GET /api/v1/salon/invoices[/{id}] (invoice.read: Owner).
    Provider events: POST http://localhost:8090/api/v1/billing/provider-events (bare platform host only; 404 elsewhere), header X-Salon-Billing-Signature =
      lowercase hex HMAC-SHA256 of the exact body with the provider key; body {eventId,invoiceId,attemptKey,outcome:success|failure,occurredAt};
      200 {eventId,result: paid|failed|already_paid|unknown|duplicate}; unsigned or wrong signature 401 invalid_credentials; bad body 400 field errors.
    Local hooks (loopback, local profile, absent from OpenAPI; any host):
      PUT|GET /local/operator/billing/provider-outcomes/{salonId} {outcome: success|failure} -> {salonId,outcome}; sticky for every later charge of that salon, default success.
      POST /local/operator/billing/provider-events/signature (any raw body) -> {header:"X-Salon-Billing-Signature",signature}.
      GET /local/operator/emails?recipient=<email> -> {items:[{messageId,salonId,recipient,kind,subject,body,links,deliveredAt}]}; DELETE /local/operator/emails[?recipient=] -> 204.
        Kinds billing.failed_charge|due|due_3|due_10|read_only; in memory until cleared or the API restarts.
      POST /local/operator/billing/run -> {at,changed:[{salonId,issued,reminders,charges,states}],failed:[subscriptionId]} (one pass at the test clock's instant).
      PUT|GET /local/operator/billing/interrupt {point:"after-invoice-issue"|null} -> {point}; one-shot.
      POST /local/operator/unbilled-salons {slug?} -> 201 {id,slug,hostname}: active, no subscription, no plan, null profile fields, neutral brand; 409 slug_taken.
      PUT /local/operator/operators/active {email,active} -> 204 for a hook-created fixture operator, 404 otherwise.
      F02 hooks /local/identity/seed, DELETE /local/identity, /local/identity/captures|providers|customers now work on every local salon (alpha/beta/gamma still id-checked).
      Test clock unchanged (GET|PUT|DELETE /local/clock); it drives the job, TOTP and token times.
    Billing job: platform job subscription-billing every 1 minute through the shared scheduler (job_claim), one platform transaction per subscription.
    BFF: /operator-web/{subscription?id, invoices?id&page&size, invoice?id} reads; mutations subscription-start {id,monthlyAmount,paymentMethod,currency?,idempotencyKey},
      subscription-change {id,version,monthlyAmount?,paymentMethod?}, plan-move {id,version,planId}, payment-record {id,reference,amount,receivedOn,idempotencyKey};
      salon-create gains subscription {monthlyAmount,paymentMethod}. /identity-web/staff/{entitlements, invoices?page} reads.
    New settings: SALON_BILLING_PROVIDER_KEY (64 hex, optional; without it there is no provider and the intake is 404); local retained in .local/billing-keys.properties
      (mode 0600, SALON_BILLING_LOCAL_KEY_FILE); SALON_BILLING_LINK_ORIGIN (default https://%s, local http://%s:3100) for email links.
