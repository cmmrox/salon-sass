    Differs from or adds to the documents (for the lead):
    - Registry: tenant.access_state ('full'|'read_only', written only by billing) beside tenant.status (lifecycle, takes precedence), and tenant.version
      for operator changes (plan moves now, S03 lifecycle). tenant_by_slug/tenant_by_id return access_state; RegisteredTenant/CurrentTenant carry readOnly.
      The platform role gets column UPDATE on tenant (plan_id, access_state, version, updated_at) only.
    - Read-only check in TenantFilter with an explicit allowlist: staff sign-in, MFA challenges/enroll/verify, session refresh, DELETE /identity/sessions and
      /sessions/{id} (own sessions, accepted by the lead as sign-out), PUT /staff/password, customer challenges and sign-in, PUT and DELETE /customers/me.
      Any other mutating /api request on a read-only salon (even one with no handler) is 403 salon_read_only before authentication; /local hooks and
      /api/v1/billing are exempt.
    - Lead decisions: a salon without a currency must be given one when its subscription starts (400 currency otherwise; refused for a salon with one),
      stored on the subscription only; a salon without an Owner contact has reminders recorded with recipient "none" and no email, and the console shows
      "No billing contact".
    - Provider events: invalid or missing signature is 401 invalid_credentials (lead-accepted); header X-Salon-Billing-Signature; the fake's outcome is
      sticky per salon (the document says "next charge outcome"). A late success after a manual payment is recorded already_paid: no second payment and
      no refund (refunds are out of scope).
    - Identity permission keys entitlement.read (every staff role) and invoice.read (Owner) are added to identity's matrix (identity-and-access.md).
    - Staff seats count active staff including the Owner; the local identity seed hook does not enforce the limit (fixtures). A plan move checks staff
      seats only (no other usage exists yet); moving to the current plan is a no-op 200. The seat race is serialized by identity's salon lock and the
      registry row share lock taken by salon_entitlements() (a plan move updates that row).
    - Times: issue/due/reminder/read-only boundaries are exact instant offsets (7, 3, 10, 14 days of 24 h); months are calendar months in the salon zone
      anchored at trial end (anchor_local stored), clock-change rules as SalonTime. issued_at is the scheduled boundary, created_at when the pass ran;
      a late pass issues every missed period (at most 36 per pass) and sends every reminder whose boundary has passed. Charge retries use the current
      payment method.
    - Invoice numbers come from a single-row counter advanced under its lock, so they have no gaps (INV-000001, six digits minimum). One payment per
      invoice (unique) because payments are exact. An issued invoice is immutable by trigger except open -> paid; the platform role has no DELETE on
      billing tables (S03's local reset will need the owning role or a function).
    - Charge requests and emails use the existing tenant outbox through outbox_enqueue_for_salon (SECURITY DEFINER, platform role, channels email and
      billing-charge only) so they commit with the invoice; a suspended salon's (S03) billing emails and charges therefore wait like its other messages.
      Outside local no email or billing-charge provider exists, so those messages wait. Emails are English only and composed by billing.
    - Entitlements response: plan/limits/features/subscription are nullable (legacy salon), and subscription adds pastDueSince and notice
      (trial_ending|past_due|read_only|null, decided with the API clock, so the banner follows the test clock). SubscriptionView.readOnlyAt is the
      future read-only instant while past due and the instant it became read-only once read-only.
    - Console money input takes major units with up to two decimals and is converted to minor units by moving the decimal point in the text (no
      floating point); anything else is sent as typed and the API names the field. Display follows the "Rs. 2,500" rule (lib/format formatMoney).
    - Console invoices page requires operator.billing.read; console subscription card, sheets and invoice page test ids are console-* (kebab), invoice rows
      console-invoice-row with data-id, record-transfer buttons with data-id; workspace billing-* and workspace-billing-banner (data-notice),
      workspace-billing nav item, account-read-only.
    - The built-artifact scan also refuses SALON_BILLING_PROVIDER_KEY and .local/billing-keys.properties. The stack files do not pass
      SALON_BILLING_PROVIDER_KEY (optional: no provider in staging until D-06).
    - F02 local identity hooks now accept every local salon (spec scope for AC-8); LocalIdentityIntegrationTest updated accordingly.
