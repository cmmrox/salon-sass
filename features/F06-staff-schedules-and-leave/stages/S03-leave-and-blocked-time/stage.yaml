    API shapes as built (field names are the spec's):
    GET schedule {version, today, weekly, dateChanges, leave: [leave], blockedTime: [block]}, both from the salon's today on: leave
    whose last day is today or later, blocks dated today or later (a block earlier today included), in date (and time) order.
    leave {id, firstDay, lastDay, type, note, bookingsToResolve}: type (annual | sick | personal | other) and note (null for none)
    absent without team.manage.
    block {id, date, starts, finishes, label, bookingsToResolve}.
    nextLeave on a member: {firstDay, lastDay, type} for the current or next leave, or null; type absent without team.manage.
    POST leave {firstDay, lastDay, type, note} -> 201 {leave, affected: [booking]}. POST blocked-time {date, starts, finishes, label}
    -> 201 {block, affected: [booking]}. The affected GETs -> 200 {affected: [booking]}. booking {date, time, customerName,
    serviceName}, as F06-S02's.
    400 field errors name firstDay, lastDay, type, note on leave and date, starts, finishes, label on a block; an unknown body field is
    a 400 naming it. 409: conflict (an overlap), limit_reached (the 101st upcoming leave, the 201st upcoming block). 404 not_found:
    another salon's id, a removed person, leave that has ended or is gone, a block that has passed or is gone, another person's.
    Storage: staff_member_leave (first_day, last_day, leave_type, note) and staff_member_blocked_time (block_date, starts, finishes,
