# Written by QA. A case is the test that proves it, titled with its id and the criteria it
# covers before a colon: test('TC-F00-S01-001 AC-1, AC-2: a free slot is listed', ...), or a
# '# TC-F00-S01-002 AC-3: ...' header comment in a k6 or shell script. The tooling reads the
# cases from the registered files; there is no case list or cases.md to keep in step.
verification:
  commands:                 # developer gates, exact shell commands, run from the repository root
  - cd apps/api && ./mvnw -q verify
  - pnpm -r lint
  - pnpm -r typecheck
  - pnpm -r test
  - pnpm --filter @salon/web test:a11y
  - pnpm --filter @salon/web build
  - pnpm contracts:check
  automation: []
  #  - id: <short name>
  #    tool: playwright      # playwright | maestro | k6 | script
  #    file: <path under qa/, as laid out in docs/qa/test-plan.md>
  #    project: <name>       # only for a tool that groups tests into projects
  #    suites: [regression]  # smoke | regression | release; decided at feature-verify
  manual: []
  #  - case: TC-F00-S01-009
  #    covers: [AC-4]
  #    reason: <why it cannot be automated, and how it was checked>
  #    performed_on: <YYYY-MM-DD>   # required: a manual case counts only once it was done
  deferred: []
  #  - case: TC-F00-S01-010
  #    covers: [AC-5]
  #    reason: <why it cannot be run yet>
  #    unblocked_by: <a stage id, or the event the spec names>

evidence:                   # only for a stage pass; a feature pass records its evidence in feature.yaml
  last_run: null            # the run this status rests on, as a path: qa/reports/<folder>
  last_result: null         # pass | fail
