    SEAT RACE EVIDENCE. With the lock removed from StaffSeatsImpl.hold() the mixed race failed at once with [201, 201] and
    the two-unlink race failed too; the log is seats-mutation-no-lock.log in the evidence folder. The many-requests race
    passed without the lock: it only checks the final count, and is no proof of serialisation. Likewise the 10-round race in
    PlanMoveCountsTeamMembersIntegrationTest passed with the defect below present: it is a final-count check only.

    CHANGES TO DELIVERED F03 BEHAVIOUR.
    - Fix 144a47d, migration V29, function salon_entitlements(). A request for a seat that waited behind a plan move read
      "no plan" and was not limited, so the salon ended over its new plan: account creation since F03-S02, adding a member
      now. Observed on the running product: over the limit in 7 of 12 rounds; a caller waiting behind a move got
      plan_id=NULL. After the fix: 0 of 12 on both paths. The lock and the plan read are now two statements of a VOLATILE
      function, with signature and grants unchanged. PlanMoveAndSeatOrderIntegrationTest holds a lock open for each order:
      without V29 exactly the three cases that wait behind a move fail (plan-order-without-v29.log), with it all 10 pass,
      including a plan with room, a salon with no plan, and the moves waiting behind an add, which count it. The lead has
      QA filing this against F03 as found after merge; no bug file was written here.
    - usage.staffSeats and the plan move now count active members with no linked account, as the spec asks.
    CHANGES TO DELIVERED F02 BEHAVIOUR.
    - Test id workspace-staff is now workspace-team. The entry's label is "Staff", no longer "Staff access"; it shows for
      team.read, so Receptionist and Professional now have it, and goes to /workspace/team. QA's delivered checks asserting
      that these roles have no such entry (qa/web/F01/S03-sidebar-navigation.spec.ts, qa/web/F02/S04-presentation.spec.ts,
      qa/web/F02/S04-functional.spec.ts) need the role's expectation changed, not only the id.
    - /workspace/staff: the page title is "Team", no longer "Staff access", with a summary line, a tab bar and an info banner
      above F02's screen, each account names its team profile. The section heading "Staff access" and every control stay.
    - Creating an account now refuses when members with no linked account fill the seats. Removing an account now clears
      its member's link. DELETE /local/identity clears links too.
    F02 contract gap, left alone by the lead's ruling: POST /api/v1/identity/staff documents only 201 and default, so its
    409 entitlement_exceeded is not a declared status, and that one test call skips the contract validator.

    FOR QA. cacheComponents keeps a route it has left in the document, hidden, so after a tab move team-tab-team and
    team-tab-accounts each appear twice with one visible, and F05's tabs do the same. Browser checks must target the visible
    element. The web test ids are team-page, team-add, team-card and its team-card-*, team-sheet and its fields, team-picker-*,
    team-photo-*, team-rule (data-reason), team-conflict, team-unavailable, team-refused, team-read-only, team-remove-*,
    team-leave-*, account-staff-team-profile.

    LEAD'S RULINGS to write into the spec at close: 201st member 409 limit_reached with "A salon can have up to 200 team
    members. Remove someone first."; the in_use items above; a removed person's photo URL answers 404 at once; singulars
    ("1 service, and any added later", "1 person · 1 shown for online booking"); name order ignores case; messages "Title
    must be 40 characters or fewer.", "Highlights must be 60 characters or fewer.", "Bio must be 140 characters or fewer.";
    maxLength left off Name, Title, Highlights and Bio, so the sheet can say those messages and the count can read 141/140,
    where F05's sheets do use it. ModuleBoundariesTest.everyModuleDeclaresWhatItMayUse allows "staff", by the ruling under
    decision 100(e).

    CHOICES THE DOCUMENTS LEAVE OPEN. A photo change raises the member's version, as a service photo does. A photo change
    takes no identity lock, since it takes no seat and changes no link; every other change takes it first. A support session
    receives signInAccountId and signInLabel, as it holds staff.list. A save with services absent means none, and with
    signInAccountId absent means no sign-in. IdentityFailure gained `problems`, the API's errors whole, for the in_use words.
    The theme gained avatar colour tokens. No new dependency.
    For the lead to decide: AC-3 lists every category with services, so "Consultations" appears once it has services, where
    the prototype's picker leaves it out, and consultations are F17's.

