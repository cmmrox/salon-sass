# Written by the developer at handoff. The stage is closed on it, and QA starts the feature pass
# from it. Facts; not how the code works.
handoff:
  run: |
    Local, from the repository root, in a plain (non-login) shell.
    With no other instance running: `infra/scripts/local-service.sh start postgres`, `... start api`, `... start web`,
    on the database you choose with SALON_DB_NAME. Migrations V1 to V29 and the local seed run at API start.
    Beside the owner's instance (API 8090, web 3100, database `salon`), as this stage was walked through. Do not use
    local-service.sh for this: it runs ensure_application_role against the shared cluster's roles, and the scripts run
    the API and web from a build of their own. Instead:
      docker exec salon-postgres psql -U salon -d postgres -c "CREATE DATABASE f06s01_walk OWNER salon"
      In one environment: SALON_DB_NAME=f06s01_walk SALON_API_PORT=8291 SALON_WEB_PORT=3291, then source
      infra/scripts/lib/common.sh and call load_settings, which fills in every other setting from its defaults, and set
      JAVA_HOME to ~/.sdkman/candidates/java/25.0.1.0+8-amzn.
      API: (cd apps/api && ./mvnw -q -DskipTests package && $JAVA_HOME/bin/java -jar target/salon-api.jar)
      Web: pnpm --filter @salon/web build, then (cd apps/web && node scripts/serve.mjs --port 3291)
    Start the web only once http://localhost:8291/actuator/health answers: it reads the operator proxy key the API writes
    on its first start, and exits with "Cannot read retained local operator proxy key" otherwise.
    Screens: http://alpha.localhost:3291/workspace/team (Team) and /workspace/staff (Sign-in accounts). The navigation
    entry is "Staff", test id workspace-team. Photos on the web: /team-photos/{id}.
    API, on the salon's host, under /api/v1/team: members (GET, POST), members/{id} (GET, PUT, DELETE ?version=),
    members/{id}/photo (PUT multipart `file`, DELETE), sign-in-accounts (GET), public (GET, public), photos/{id} (GET,
    public). BFF actions under /identity-web/{kind}/: team-members, team-sign-in-accounts, team-member-add,
    team-member-save, team-member-remove, team-photo (multipart: memberId, file), team-photo-remove.
    New settings: salon.staff.images.max-bytes (5MB), .max-pixels (50000000), .concurrent-decodes (2); environment
    SALON_STAFF_IMAGE_MAX_BYTES, _MAX_PIXELS, _CONCURRENT_DECODES. No new local hook.
    To stop: end both processes and DROP DATABASE f06s01_walk.
  data: |
    No salon gains a team member: every salon starts with none, the seed included. Staff accounts come from
    POST /local/identity/seed as before. A person's services need services in the catalogue, and no service is seeded.
    DELETE /local/identity now also clears the links of the salon's team members; the members stay.
    The walk-through's accounts were random and were never kept outside the session's scratchpad; its database
    f06s01_walk was dropped. Salons used: alpha and beta for the API walk (two salons, every role and a support session),
    gamma for the browser walk and for the salon states.
    API shapes as built (field names are the spec's):
    member {id, name, title, highlights, bio, shownOnline, photoId, photoUrl, services: {categoryIds, serviceIds},
    signInAccountId, signInLabel, version}: title, highlights, bio, photoId, photoUrl, signInAccountId and signInLabel may
    be null; the two sign-in fields are absent without staff.list.
    sign-in-accounts {items: [{id, label, role, memberId}]}, memberId nullable.
    public {items: [{id, name, title, highlights, bio, photoUrl, serviceIds}]}.
    400 errors name: name, title, highlights, bio, shownOnline (save only), services, signInAccountId, version, file.
    409: limit_reached; conflict; invalid_state; entitlement_exceeded with errors naming staffSeats; in_use with
    {field:"upcomingBookings",detail:"<N>"} on removal and one {field:"services",detail:"<service name>"} per service on a
    save.
  notes: |
    Tested source: 0b0c05e. This commit changes only this file and the generated documents.

    GATES, each once on 0b0c05e with a clean tree, in the checkout this stage was built in. Logs and summary.txt:
    /Users/cmmrox/Personal/Projects/salon-sass/.claude/worktrees/F06-S01-dev/.local/logs/gates/
    | Command | Result | Log |
    | cd apps/api && ./mvnw -q verify | exit 0; 1530 tests, 0 failures, 0 errors, 0 skipped, 180 classes | 1-api-verify.log |
    | pnpm -r lint | exit 0 | 2-lint.log |
    | pnpm -r typecheck | exit 0 | 3-typecheck.log |
    | pnpm -r test | exit 0; web 1132, api-contracts 25, format 11 | 4-test.log |
    | pnpm --filter @salon/web test:a11y | exit 0; 282 tests in 10 files | 5-a11y.log |
    | pnpm --filter @salon/web build | exit 0; artifact scan clean | 6-build.log |
    | pnpm contracts:check | exit 0; document and client current | 7-contracts.log |
    Time observed: the gates took 22 minutes, 21 of them the API's. Time building, diagnosing and walking: unknown.

