id: F06-S01
feature: F06
title: "Team members and profiles"
sequence: 1
surfaces: [api, web]
status: planned             # outlined | planned | in-progress | built | complete | released
qa_status: not-run          # stays not-run: QA passes the feature. Set only by a stage pass the owner asked for
blocked_reason: null        # QA: what stops a stage pass, when qa_status is blocked
released_in: null
reopened_by: null           # lead: the change request that reopened a closed stage, for example CR-004
depends_on: []
requirements: [STF-01]
nfr_focus: []               # non-functional requirements of the feature that this stage proves

# Written by the developer at handoff. The stage is closed on it, and QA starts the feature pass
# from it. Facts; not how the code works.
handoff:
  run: null                 # commands that start the product and reach what this stage built
  data: null                # the accounts and seed data that exist
  notes: null               # criterion-to-result/evidence; gate commands, tested source, log paths,
                            # results and relevant conditions; gaps and differences from docs/

# Written by QA. A case is the test that proves it, titled with its id and the criteria it
# covers before a colon: test('TC-F00-S01-001 AC-1, AC-2: a free slot is listed', ...), or a
# '# TC-F00-S01-002 AC-3: ...' header comment in a k6 or shell script. The tooling reads the
# cases from the registered files; there is no case list or cases.md to keep in step.
verification:
  commands:                 # developer gates, exact shell commands, run from the repository root
  - cd apps/api && ./mvnw -q verify
  - pnpm -r lint
  - pnpm -r typecheck
  - pnpm -r test
  - pnpm --filter @salon/web test:a11y
  - pnpm --filter @salon/web build
  - pnpm contracts:check
  automation:
  - id: team-members-api
    tool: playwright
    file: qa/api/F06/S01-team-members.spec.ts
    project: api
    suites: [regression]
  - id: team-seats-and-races
    tool: playwright
    file: qa/api/F06/S01-seats-and-races.spec.ts
    project: api
    suites: [regression]
  - id: team-screens
    tool: playwright
    file: qa/web/F06/S01-team-screens.spec.ts
    project: web
    suites: [regression]
  #  - id: <short name>
  #    tool: playwright      # playwright | maestro | k6 | script
  #    file: <path under qa/, as laid out in docs/qa/test-plan.md>
  #    project: <name>       # only for a tool that groups tests into projects
  #    suites: [regression]  # smoke | regression | release; decided at feature-verify
  manual: []
  #  - case: TC-F00-S01-009
  #    covers: [AC-4]
  #    reason: <why it cannot be automated, and how it was checked>
  #    performed_on: <YYYY-MM-DD>   # required: a manual case counts only once it was done
  deferred:
  - case: TC-F06-S01-011
    covers: [AC-7]
    reason: A removal refused with 409 in_use (its errors carrying {field upcomingBookings, detail N}), nothing
      changed, and the sheet's "<name> has N upcoming bookings. Move or cancel them first.", need an upcoming
      booking for the person. No booking exists before F07, and until booking implements
      UpcomingMemberBookings staff's own implementation answers "none" (decision 100). The spec has the
      developer's integration test, with an implementation that reports a booking, prove the refusal. From
      outside, TC-F06-S01-010 and TC-F06-S01-049 show removal when no booking needs the person.
    unblocked_by: F07
  - case: TC-F06-S01-012
    covers: [AC-8]
    reason: A save that stops a person performing a service with an upcoming booking for them, refused with 409
      in_use (its errors carrying one {field services, detail <service name>} per service), nothing changed, and
      the sheet's "This person has upcoming bookings for <services>. Move them first.", needs such a booking. No
      booking exists before F07, and the interface answers "none" until then (decision 100). The spec has the
      developer's integration test prove the refusal. From outside, TC-F06-S01-010 shows the save when no booking
      needs the service.
    unblocked_by: F07
  - case: TC-F06-S01-013
    covers: [AC-4]
    reason: TeamMembers is a Java interface with no route, whose first callers from outside are F07's bookings and
      F10's calendar. The developer's integration tests call it for the caller's salon only. From outside until
      then, TC-F06-S01-009 proves a removed person's id and name stay stored. With F07 a past booking must keep the
      removed person's name, and another salon's person must not be bookable.
    unblocked_by: F07
  #  - case: TC-F00-S01-010
  #    covers: [AC-5]
  #    reason: <why it cannot be run yet>
  #    unblocked_by: <a stage id, or the event the spec names>

evidence:                   # only for a stage pass; a feature pass records its evidence in feature.yaml
  last_run: null            # the run this status rests on, as a path: qa/reports/<folder>
  last_result: null         # pass | fail
