id: F06-S02
feature: F06
title: "Working hours and date changes"
sequence: 2
surfaces: [api, web]
status: planned             # outlined | planned | in-progress | built | complete | released
qa_status: not-run          # stays not-run: QA passes the feature. Set only by a stage pass the owner asked for
blocked_reason: null        # QA: what stops a stage pass, when qa_status is blocked
released_in: null
reopened_by: null           # lead: the change request that reopened a closed stage, for example CR-004
depends_on: [F06-S01]
requirements: [STF-02]
nfr_focus: []               # non-functional requirements of the feature that this stage proves

# Written by the developer at handoff. The stage is closed on it, and QA starts the feature pass
# from it. Facts; not how the code works.
handoff:
  run: null                 # commands that start the product and reach what this stage built
  data: null                # the accounts and seed data that exist
  notes: null               # criterion-to-result/evidence; gate commands, tested source, log paths,
                            # results and relevant conditions; gaps and differences from docs/

# Written by QA. A case is the test that proves it, titled with its id and the criteria it
# covers before a colon: test('TC-F00-S01-001 AC-1, AC-2: a free slot is listed', ...), or a
# '# TC-F00-S01-002 AC-3: ...' header comment in a k6 or shell script. The tooling reads the
# cases from the registered files; there is no case list or cases.md to keep in step.
verification:
  commands:                 # developer gates, exact shell commands, run from the repository root
  - cd apps/api && ./mvnw -q verify
  - pnpm -r lint
  - pnpm -r typecheck
  - pnpm -r test
  - pnpm --filter @salon/web test:a11y
  - pnpm --filter @salon/web build
  - pnpm contracts:check
  automation:
  - id: schedule-weekly-hours-api
    tool: playwright
    file: qa/api/F06/S02-weekly-hours.spec.ts
    project: api
    suites: [regression]
  - id: schedule-date-changes-api
    tool: playwright
    file: qa/api/F06/S02-date-changes.spec.ts
    project: api
    suites: [regression]
  - id: schedule-access-api
    tool: playwright
    file: qa/api/F06/S02-schedule-access.spec.ts
    project: api
    suites: [regression]
  - id: schedule-screens
    tool: playwright
    file: qa/web/F06/S02-schedule-screens.spec.ts
    project: web
    suites: [regression]
  #  - id: <short name>
  #    tool: playwright      # playwright | maestro | k6 | script
  #    file: <path under qa/, as laid out in docs/qa/test-plan.md>
  #    project: <name>       # only for a tool that groups tests into projects
  #    suites: [regression]  # smoke | regression | release; decided at feature-verify
  manual: []
  #  - case: TC-F00-S01-009
  #    covers: [AC-4]
  #    reason: <why it cannot be automated, and how it was checked>
  #    performed_on: <YYYY-MM-DD>   # required: a manual case counts only once it was done
  deferred:
  - case: TC-F06-S02-028
    covers: [AC-8, AC-9, AC-14]
    reason: TeamSchedule is a Java interface with no route, whose first caller from outside is F07's availability, and it
      is this stage's highest risk because F07 trusts its windows. Not reachable until then, so not tested by QA from
      outside - whether a person works, the windows after breaks at every edge, in time order, always at least one when
      working; a date change replacing the week on that date only, and saying it decided the answer; a removed member working
      no date; an unknown or another salon's id "not found"; a range too long or reversed refused; closures and holidays
      ignored; nothing cached. The developer's integration tests carry all of this until F07. From outside until then, cases
      007, 009, 014, 015 and 019 prove what it reads, that a stored day holds what was sent and that no working day can be
      stored with no time left. With F07 the offered times must match the windows, for this salon only.
    unblocked_by: F07
  - case: TC-F06-S02-029
    covers: [AC-11]
    reason: The upcoming bookings a new week leaves outside the person's working time, and those a date change affects, need
      a booking. No booking exists before F07, and MemberBookingsAffected answers "none" until booking implements it
      (decision 102). The spec has the developer's integration test, with an implementation that reports a booking, prove the
      list and that nothing is moved or cancelled. From outside until then, cases 005 and 014 show the empty answers, and case
      041 shows the sheet's words and list from a real save whose answer gains a list in the browser. With F07 the list must
      name real bookings, each kept.
    unblocked_by: F07
  #  - case: TC-F00-S01-010
  #    covers: [AC-5]
  #    reason: <why it cannot be run yet>
  #    unblocked_by: <a stage id, or the event the spec names>

evidence:                   # only for a stage pass; a feature pass records its evidence in feature.yaml
  last_run: null            # the run this status rests on, as a path: qa/reports/<folder>
  last_result: null         # pass | fail
