# Written by the developer at handoff. The stage is closed on it, and QA starts the feature pass
# from it. Facts; not how the code works.
handoff:
  run: |
    Local, from the repository root, in a plain (non-login) shell, as F06-S01's handoff says. Migrations V1 to V30 and the
    local seed run at API start. Beside the owner's instance (API 8090, web 3100, database `salon`), as this stage was
    walked through. Do not use local-service.sh for this: it runs ensure_application_role against the shared cluster's roles.
      docker exec salon-postgres psql -U salon -d postgres -c "CREATE DATABASE f06s02_walk OWNER salon"
      In one environment: SALON_DB_NAME=f06s02_walk SALON_API_PORT=8292 SALON_WEB_PORT=3292, then source
      infra/scripts/lib/common.sh and call load_settings, and set JAVA_HOME to ~/.sdkman/candidates/java/25.0.1.0+8-amzn.
      API: (cd apps/api && ./mvnw -q -DskipTests package && $JAVA_HOME/bin/java -jar target/salon-api.jar)
      Web, once http://localhost:8292/actuator/health answers: pnpm --filter @salon/web build, then
      (cd apps/web && node scripts/serve.mjs --port 3292)
    Screen: http://alpha.localhost:3292/workspace/team, each card's Schedule button (test id team-card-schedule), and the card's
    Hours row. A salon's opening hours are under /workspace/settings/hours.
    API, on the salon's host, under /api/v1/team/members/{id}/schedule: GET; weekly (PUT); date-changes (POST);
    date-changes/{changeId} (DELETE). GET /api/v1/team/members and /{id} now carry weekly. BFF actions under
    /identity-web/{kind}/: team-schedule?memberId= and team-opening-hours (reads, team.read); team-week-save (body id, version,
    weekly), team-date-change-add (body id and the change's fields), team-date-change-remove (body id, changeId).
    The test clock (/local/clock) moves "today". While it is set an account with an authenticator cannot sign in with a real
    code, which follows real time: use a Manager, which has team.manage and no authenticator.
    No new setting. To stop: end both processes and DROP DATABASE f06s02_walk.
  data: |
    Nothing is seeded by this stage. A person added now has a week copied from the salon's opening hours when they are added.
    A salon starts with no saved hours, so the seed's salons give a week of no working days until Settings saves some. To get a
    member from before this stage, insert one staff_team_member row with SQL: it has no schedule row, reads as version 0 with no
    working days, and its first save answers version 1. There is no backfill.
    The walk-through's accounts were random and were kept only in the session's scratchpad, in a file not copied anywhere. Its
    database f06s02_walk was dropped. Salons: alpha and beta for the API walk, gamma for the browser walk.
    API shapes as built (field names are the spec's):
    GET schedule {version, today, weekly: [day], dateChanges: [change]}. `today` is an addition to the spec: the salon's date by
    the application's clock, which the sheet's calendar and QA's clock checks use. version is 0 when the week has never been saved.
    day {day, working, starts, finishes, breaks: [{starts, finishes}]}: times null and breaks empty when not working; breaks in time
    order, whatever order they were sent.
    PUT weekly {version, weekly} -> 200 {version, weekly, affected: [booking]}.
    POST date-changes {date, working, starts, finishes, breaks, note} -> 201 {change, affected: [booking]}.
    change {id, date, working, starts, finishes, breaks, note}: note null for none, and absent without team.manage.
    booking {date, time, customerName, serviceName}.
    400 errors name, on a weekly save under weekly[n]. and on a date change with no prefix: starts or finishes (not a quarter hour;
    a finish not after the start; times sent on a day not worked); breaks (more than five; breaks that leave none of the day);
    breaks[m] (not inside the hours); breaks[m].finishes (does not end after it starts, or off the step); breaks[m].starts (overlaps
    an earlier one, or off the step); working; and on a save weekly, weekly[n].day, version; on a date change date, note.
    An unknown body field is a 400 naming it. A day not worked keeps no breaks, whatever was sent: that is not refused.
    409: conflict (stale version; a second change on a date); invalid_state (a save that changes nothing, checked after the version);
    limit_reached (the 101st upcoming change). 404 not_found: another salon's session on this host, another salon's id, a removed
    person, a change that has passed or gone or is another person's.
    Audit actions, subject staff_team_member and the member's id: staff.team_member_hours_saved (before and after each hold version,
    changedDays and days, naming only the weekdays changed), staff.team_member_date_change_added and _removed (changeId, date,
    working, starts, finishes, breaks as "HH:MM-HH:MM", hasNote).
  notes: |
    Tested source: b5d034a. This commit changes only this file and the generated documents.

    GATES, each once on b5d034a with a clean tree, in the checkout this stage was built in. Logs and summary.txt:
