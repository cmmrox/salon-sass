    salon's hours afterwards changes nobody; a member inserted by SQL reads no working days at version 0, saves first to version 1,
    and version 0 is then stale. The answer to adding a member carries weekly.
    AC-2 checked (API 17, browser 13): the whole week saved, the exact fields, null times, every refusal with nothing saved; on the
    sheet each message, Save hours disabled while a rule is broken and while nothing has changed, the toast, the Hours row following.
