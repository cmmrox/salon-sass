    browser 203 of 204 in real Chromium. The one failure is the defect under "Found, not fixed". Evidence, with the scripts and
    screenshots, no credentials: /Users/cmmrox/Personal/Projects/salon-sass/.claude/worktrees/F06-S01-dev/.local/f06-s02-walk/
    (api_walk_result.json, browser_walk_result.json, screens/, mutations-lock-fill-removed-breaks-key.log). The scripts are not
    product code and were not committed. The steps under `run` stand without them.

