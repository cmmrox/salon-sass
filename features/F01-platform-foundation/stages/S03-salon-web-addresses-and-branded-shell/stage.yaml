    How it is built, for the documents:
    - The hostname is forwarded to the API as the Host header of the request to SALON_API_BASE_URL, set to the
      canonical <slug>.<platform domain> with no port. Node's fetch drops a Host header, so the generated client
      is given a fetch built on node:http (apps/web/src/lib/api/forward-hostname.ts). No parameter or custom
      header names the salon; no new dependency.
    - The web app reads Host only; X-Forwarded-Host and Forwarded are ignored. A hostname that is not one label
      in front of the platform domain, or whose label is not in the slug form (3-30 of a-z, 0-9, -), is
      "salon not found" without calling the API. Reserved slugs are left to the API (404).
    - Status codes (decision 028): proxy.ts answers 404 and both 503s itself, as complete HTML from
      apps/web/src/lib/plain-page (proved by unit tests and on the running product). The shell is a page reached
      by rewrite to /salon-site and answers 200; /salon-site asked for from outside answers the app's 404.
    - The plain pages inline styles/tokens.css and styles/base.css from their one source (a Turbopack rule makes
      `*.css?raw` text; vitest.config.mts has the same for tests). Turbopack cannot give a CSS module's source as
      text (internal error "inner asset should be CSS processable"), so the plain pages' layout is in
      lib/plain-page/plain-page.css: it repeats the rules of the AppShell, Notice and Status modules, in tokens
      only (a test forbids any colour or size of its own). A change to those modules' layout must be made there too.
    - Caching turned off: the API is asked on every request in the proxy, nothing is memoised. Every response on a
      salon hostname carries Cache-Control: private, no-cache, no-store, max-age=0, must-revalidate. The shell
      reads the request's headers, so the framework renders it per request; its prerendered static shell holds
      only the neutral loading skeleton.
    - The proxy hands the resolved salon to the page in the request header x-salon-resolved, which it first
      removes from every request. The page does not call the API again. So in the race where a salon is suspended
      between the proxy's check and the response, that one response shows the brand the API returned a moment
      before; the next request shows "temporarily unavailable". There is no second fetch to disagree with the first.
    - The proxy waits at most 3 s for the API (API_TIMEOUT_MS), then answers "service unavailable".
    - An unset or unusable SALON_PLATFORM_DOMAIN makes every web request "service unavailable", with a warning in
      the server log (accepted in decision 028).
    - The brand is applied by a <style> rule `:root{--color-brand;--color-on-brand}` rendered with the shell;
      the contrast colour is the one of white and --color-text (#1b1b1f) that contrasts more
      (apps/web/src/styles/brand.ts). The colour is used exactly as the API gives it, and only if #RRGGBB.
    - The web app only accepts a brand whose slug equals the hostname's slug; any other answer is "unavailable".
    - A web log line about a salon names its slug (T-8), never the error's message.
    Different from a document, or to record (the lead corrects the documents):
    - A bare network address, 127.0.0.1 and [::1] on the web port now answer "salon not found" (404), by the
      hostname rule. qa/checks/F01/S02-listening.sh line 150 still expects 200 there; left untouched, for QA at
      the feature pass (decision 028). README.md's phone-testing note: a phone on the network now sees that page.
    - docs/engineering/web.md: proxy.ts answers the three non-salon pages itself (plain HTML), the salon is passed
      to the page in x-salon-resolved, and base.css / plain-page.css exist. "The web app waits three seconds for
      the API" now also applies to the proxy.
    - docs/architecture/tech-stack.md: the Turbopack `*.css?raw` text rule and its Vitest twin.
    - globals.css now imports styles/base.css; the shared visually-hidden and skeleton styles are in
      styles/shared.module.css, which Status.module.css and SalonShell.module.css compose from.
    Left out: nothing in the spec's scope.
