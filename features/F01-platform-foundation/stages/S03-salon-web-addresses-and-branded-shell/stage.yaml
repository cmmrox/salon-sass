    \ No parameter or custom\n  header names the salon; no new dependency.\n- The web app reads Host only;\
    \ X-Forwarded-Host and Forwarded are ignored. A hostname that is not one label\n  in front of the\
    \ platform domain, or whose label is not in the slug form (3-30 of a-z, 0-9, -), is\n  \"salon not\
    \ found\" without calling the API. Reserved slugs are left to the API (404).\n- Status codes (decision\
    \ 028): proxy.ts answers 404 and both 503s itself, as complete HTML from\n  apps/web/src/lib/plain-page\
    \ (proved by unit tests and on the running product). The shell is a page reached\n  by rewrite to\
    \ /salon-site and answers 200; /salon-site asked for from outside answers the app's 404.\n- The plain\
    \ pages inline styles/tokens.css and styles/base.css from their one source (a Turbopack rule makes\n\
    \  `*.css?raw` text; vitest.config.mts has the same for tests). Turbopack cannot give a CSS module's\
    \ source as\n  text (internal error \"inner asset should be CSS processable\"), so the plain pages'\
    \ layout is in\n  lib/plain-page/plain-page.css: it repeats the rules of the AppShell, Notice and\
    \ Status modules, in tokens\n  only (a test forbids any colour or size of its own). A change to those\
    \ modules' layout must be made there too.\n- Caching turned off: the API is asked on every request\
    \ in the proxy, nothing is memoised. Every response on a\n  salon hostname carries Cache-Control:\
    \ private, no-cache, no-store, max-age=0, must-revalidate. The shell\n  reads the request's headers,\
    \ so the framework renders it per request; its prerendered static shell holds\n  only the neutral\
    \ loading skeleton.\n- The proxy hands the resolved salon to the page in the request header x-salon-resolved,\
    \ which it first\n  removes from every request. The page does not call the API again. So in the race\
    \ where a salon is suspended\n  between the proxy's check and the response, that one response shows\
    \ the brand the API returned a moment\n  before; the next request shows \"temporarily unavailable\"\
    . There is no second fetch to disagree with the first.\n- The proxy waits at most 3 s for the API\
    \ (API_TIMEOUT_MS), then answers \"service unavailable\".\n- An unset or unusable SALON_PLATFORM_DOMAIN\
    \ makes every web request \"service unavailable\", with a warning in\n  the server log (accepted in\
    \ decision 028).\n- The brand is applied by a <style> rule `:root{--color-brand;--color-on-brand}`\
    \ rendered with the shell;\n  the contrast colour is the one of white and --color-text (#1b1b1f) that\
