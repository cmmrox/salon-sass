    For the reviewer (isolation and security):
    1. Every repository read uses Hibernate's filter; findById relies on Hibernate 7 applying @TenantId to find() (proved by AC-3).
    2. Statements that were JPQL bulk deletes or EntityManager native queries are now JdbcClient: they no longer trigger Hibernate's
       auto-flush before running. Each runs inside the salon's identity transaction under its lock; tests show identical outcomes.
    3. TenantRegistry applies the request wait limit through a TransactionAwareDataSourceProxy instead of a ConnectionCallback (same
       connection inside a transaction; DatabaseFrozen/DatabaseTimeouts/Health tests pass).
    4. Spring 7's JdbcClient single() throws on a NULL value where queryForObject returned null; every converted statement that could
       return NULL uses optional() or list().
    5. No entity, log line or toString prints a password hash, MFA secret or token (no generated toString; Lombok denies it).

    Choices to write down (common practice, not in the docs):
    1. shared.persistence.NewEntities<T> (named interface shared :: persistence) is a repository fragment whose persist() calls
       EntityManager.persist. Spring Data's save() merges an entity with an assigned UUID and no @Version (an extra select and a different
       instance, which would lose later changes such as attempts++), and Persistable cannot be used because domain/ may not use Spring.
       Its implementation must be named NewEntitiesImpl: Spring Data finds fragment implementations by that suffix.
    2. Direct-SQL classes live per module in infrastructure: identity's IdentityLock, ExpiredSecurityState, CustomerDataErasure,
       SyntheticIdentityReset, IdentityPlatformFunctions; branding's BrandPlatformFunctions; platform's *Store classes (one per table group).
    3. Persistence fixtures are sources under src/test/compile-fixtures/fixture/persistence, compiled by the test (FixtureCompiler, shared
       with CodeGenerationConventionsTest): an @Entity or JpaRepository on the test class path would be scanned by every integration test.
    4. Kind and purpose constants left the entities (SessionKind, MfaPurpose), so that "an @Entity has no public field" holds literally.
    5. StaffRole is mapped with @Enumerated(STRING) on identity_staff.role (same values); response records keep their simple names.

    Different from the docs or the spec (for the lead):
    1. Spec scope names only OperatorAccess, OperatorSessions and OperatorSignIns in platform/application; 22 more platform/application
       classes and three platform/local hooks ran SQL through PlatformDatabase. AC-2 and the objective need them all in infrastructure, so
       all moved (platform stores above).
    2. The identity lock-row insert (INSERT ... ON CONFLICT DO NOTHING on identity_guard) fits none of backend.md's five named exceptions;
       a repository cannot express it without changing the concurrency outcome (two first uses must both wait, not fail). Kept as direct SQL
       in IdentityLock with its RLS-alone test; backend.md may want it listed (with exception 3, conditional writes for locking).
    3. backend.md "Code generation" and "Persistence" do not mention the NewEntities fragment or that a fixture whose classes Spring would
       scan belongs under compile-fixtures, not src/test/java/<base>/architecture/fixture (backend.md "Tests").
    4. Response mapping: no controller handles an entity; use cases return records built by hand (StaffView, Profile, ...), shorter than a
       mapper and the spec's "by hand where that is shorter". No new MapStruct mapper.
    5. operator-console.md and identity-and-access.md describe the security rules unchanged; no wording change needed from this stage.
    Nothing left unfinished. No new dependency, no migration.

