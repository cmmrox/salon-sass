    No migration, seed or fixture data change. The walk-through ran against a fresh database salon_f23_s08 in this project's own
      container (created empty, migrated with the local seed by the API: 16 migrations, salons alpha/beta/gamma; dropped
      afterwards), because the retained database carries the stray V17 salon_setup. Synthetic admin.walk@operator.test
      (OPERATOR_ADMIN) and owner.walk@alpha.test (OWNER) were seeded through the local hooks with a random password and TOTP
      secret, not recorded; they went with that database. The retained database is untouched. API and web were not running
