        SubscriptionBilling.{ChangeInput, PlanMoveInput, StartInput, Started}, SupportCrypto.Claims,
        SupportSessionStore.{Entered, NewSession, Salon, SalonAuditEntry, Session}, SupportSessions.StartInput.
      shared (16): AuditTrail.AuditPage, ModuleOwnership.Module, OutboxMessageRepository.Payload, OutboxSettings.{Backoff,
        Breaker, Provider}, OutboxStore.{Backlog, Claim, Claimed, Due, NotTaken, OutOfAttempts}, Probes.Request,
        SalonEntitlements.Limits, TenantDataModule.Table, TenantJobActivity.Counts.

    Differences from the documents and the spec (the lead corrects them; nothing under docs/ edited):
    1. The rule's shared.web allowance is used today only by MetaResponse (shared.web, the service metadata): no controller
       returns a problem shape as a record (problems are Spring's ProblemDetail), so "or shared.web for the shared problem
       shapes" in the spec and backend.md in practice covers the meta response.
    2. shared has no business-module layout, so its local hooks' records are in shared/local/dto: the rule accepts any dto
       package inside the controller's module (backend.md "Inside a module" names dto/ for business modules only).
    3. The privacy rule counts a sealed result type's cases as one contract: OutboxStore.NotTaken is named only by OutboxStore and
       an integration test that asserts isInstanceOf(OutboxStore.NotTaken.class), while OutboxDispatcher matches its sibling
       cases; the rule only sees main code, so without this NotTaken would have to be private and the test could not compile.
       Local records declared inside a method (ModuleOwnership's Claim) are not member records and are out of the rule.
    4. Logger names do not change (only records moved). Nothing under qa/ or docs/ names a moved Java type.
    5. Observed, as at S07: the web build stopped once on Next.js's known security advisory (web-build.attempt1.log) and
       succeeded on retry; the upgrade belongs to F23-S06 per CR-022.

    Time (observed, +05:30): reading and planning about 20 min (to 03:51); extraction, rules and focused tests about 75 min
      including the AC-3 scope question to the lead (answered by decision 062 at 03:53); commits 04:07; gates 04:08-04:15;
      walk-through 04:15-04:18; diagnosis/rework: the copied wildcard and Schema imports, the moved records' unknown-field
      helper, and the sealed-case refinement of the privacy rule, a few minutes each.
