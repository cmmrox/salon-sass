  notes: |
    Developer gates (verification.commands), run from the repository root on the clean tree at 9f1327e; logs in
    /Users/cmmrox/Personal/Projects/salon-sass/.local/logs/F23-S08/ (ignored path; keep until closure), surefire copies in surefire/.
    | command | revision | result | log |
    | cd apps/api && ./mvnw -q verify | 9f1327e | exit 0 in 371 s; 126 report classes, 904 tests, 0 failures, 0 errors, 0 skipped (04:08-04:14 +05:30) | mvnw-verify.log |
    | pnpm contracts:check | 9f1327e | exit 0; "docs/api/openapi.json and packages/api-contracts/src/generated are current" | contracts-check.log |
    Conditions: Maven on JDK 21.0.9 with the toolchain's JDK 25.0.1, pnpm through Corepack, Testcontainers PostgreSQL (max_connections
    200), test server on 127.0.0.1. No local API was running during the gates.

    Acceptance criteria:
    AC-1 checked: 114 records moved, exactly the list the new rule produced against 041bc6f: identity 26 (12 controller requests,
      4 local-hook records, 8 service responses, and the top-level service records Page and SessionView), platform 82 (16
      controller requests, 22 records nested in the local hooks, 44 nested in services, including the job results and
      AccountInput that the local hooks return or read), shared.local 5; branding already complete
      (SalonResponse). New rule controllerRecordsAreTopLevelInDto walks each handler's @RequestBody and return type through
      generics, arrays and record components; it passes for the application and, in ControllerRecordsTest, fails naming the
      record on compile-fixtures nestedrequest (BookingController$BookRequest), nestedresponse (BookBooking$Slot inside
      ResponseEntity), nestedcomponent (BookBooking$Slot reached only through List<SlotPage>'s component) and othermodule
      (payment.dto.Receipt returned by booking), and passes on clean. The fixtures are compiled from src/test/compile-fixtures
      because Spring would otherwise scan and serve the controllers in every integration test context.
    AC-2 checked: OpenApiDocumentTest (byte comparison) passed after identity alone and again after platform and shared.local;
      pnpm contracts:check passes at 9f1327e; git diff 041bc6f..9f1327e -- docs/api packages/api-contracts is empty. No
      @Schema(name) was needed: every record in the document kept its simple class name.
    AC-3 checked: new rule nestedRecordsUsedOnlyByTheirClassArePrivate passes for the application and fails on fixture
      nestedrecordvisible (BookBooking$Window). It made two records private: identity CustomerMessageCapture.Key and ChallengeKey.
      Spring Modulith verification passes, so the records below stay inside their module or behind a declared named interface.
    AC-4 checked: no test file deleted or renamed; @Test/@ParameterizedTest methods 479 -> 481 (the two in ControllerRecordsTest);
      the four existing tests touched (IdentityContractIntegrationTest, OperatorTestSupport, SalonLifecycleIntegrationTest,
      SubscriptionBillingIntegrationTest) change type references only, no assertion line; 904 tests pass (898 at S07 plus 6 new
      rule cases). Running product (fresh database, API built from 9f1327e, web on 3100): operator signed in with password and
      TOTP at console.localhost:3100, salon list (3 synthetic salons), Alpha's detail (lifecycle, history, subscription), plans
      ("No plans yet"); Alpha's owner signed in with TOTP at alpha.localhost:3100: Account and security (permissions, signed-in
      devices), Staff access, Activity log (the failed and the successful sign-in), Plan and billing. Negatives: wrong password
      -> 401 and "The sign-in details did not match"; Alpha's owner on beta's host -> 401 invalid_credentials;
      /api/v1/operator/salons on alpha's host -> 404 not_found; unknown field on operator sign-in -> 400 bad_request
      [extra: is not allowed]; a number for a string -> 400 [password: must be text]; blank password -> 400 [password: must not
      be blank]. Every changed local hook answered with the same fields as before (clock, billing/export/deletion runs,
      support expiry, salon background, interrupts, bootstrap failure, provider outcome, emails, probes, identity seed, operator
      seed, customer delivery and capture). Request log walk-requests.txt (329 lines): 312 2xx; the 4xx are the deliberate
      negatives, the signed-out 401s on /operator/me and /operator/sessions/refresh before sign-in, and the designed 404 for
      Alpha's missing subscription; no 5xx.

    Naming choices (the OpenAPI document constrained only the records it shows, and they all kept their names):
    - Local-hook records, which the document never shows, were renamed where the nested name clashed or meant nothing outside
      its class: BillingJob.Pass -> BillingJobPass, SalonDeletion.Pass -> DeletionJobPass, SalonExports.Pass -> ExportJobPass,
      LocalSupportController.Pass -> SupportExpiryPass, LocalReset.Result -> LocalResetResult, LocalLifecycleController
      InterruptRequest/Outbox/Jobs/Background -> LifecycleInterruptRequest/OutboxCounts/JobCounts/SalonBackground,
      LocalBillingController OutcomeRequest/OutcomeState/Signature/Emails/InterruptRequest/InterruptState ->
      ProviderOutcomeRequest/ProviderOutcomeState/ProviderEventSignature/CapturedEmails/BillingInterruptRequest/
      BillingInterruptState, LocalOperatorController SeedRequest/SeedResult/FaultRequest/FaultState -> OperatorSeedRequest/
      OperatorSeedResult/BootstrapFaultRequest/BootstrapFaultState, identity CustomerMessageCapture.Captured -> CapturedMessage,
      LocalCustomerController.Control -> ProviderControl. Their JSON is unchanged (record components kept).
    - identity's local delivery hook returned shared.outbox.OutboxMessageView, another module's record: it now returns
      identity/dto/DeliveryView, the same ten fields in the same order (status is still OutboxStatus), mapped in the controller.

    Small structural moves the extraction needed (behaviour unchanged):
    - Page.requireValid (the paging limits) moved from the response record to identity/service/Pagination (package-private).
    - The unknown-field refusal the strict request records call moved from CustomerProfileController (private) and
      OperatorRequests.unexpected into a package-private dto/UnknownField in each module; same 400 bad_request, same field name
      and detail ("is not allowed", "owner."/"subscription." prefixes kept). OperatorRequests keeps only the path-id rule.
    - The moved records' fully qualified @io.swagger...Schema annotations are now an imported Schema; copied wildcard imports
      became explicit ones. Validation, Jackson and OpenAPI annotations moved with each record unchanged.
    - Services now return the dto records directly (no MapStruct mapper added: no entity-to-response factory was involved, and
      DeliveryView.from is shorter by hand).

    Records that stay nested and are used by other classes of their module (decision 062; visibility unchanged, 85):
