    FINAL ENDPOINT SHAPES (salon host, under /api/v1/bookings; booking module, OpenAPI tag booking)
    POST /api/v1/bookings, header Idempotency-Key (UUID, required), body
      {memberId, serviceId, variantId?, date YYYY-MM-DD, time HH:MM, customer: {name, mobile}, channel} -> 201 Booking.
      An unknown field anywhere (customer.x included) is a 400 naming it.
    GET /api/v1/bookings?from=&to=&state=(repeatable)&memberId=&q=&page=&size= -> 200 BookingPage {items, page, size, total};
      from/to required, both included, at most 31 dates; page from 0; size 1 to 100, 50 by default; q at most 60 characters.
    GET /api/v1/bookings/{id} -> 200 BookingDetail {booking: Booking, history: [entry], allowedActions: [name]}
      (nested, not flattened: the spec allowed the shape to follow the conventions).
    POST /{id}/confirm | arrive | start | no-show | undo-no-show -> 200 Booking; POST /{id}/cancel {reason, note?} -> 200 Booking;
      POST /{id}/release -> 204. A path id that is not a UUID is 404.
    Booking {id, reference "K7M-4QX", state, startsAt, endsAt, holdExpiresAt (null unless held), member {id, name},
      service {id, name, variantId|null, variantName|null}, customer {name, mobile national "077 123 4567"}, channel,
      priceMinor, currency, createdAt}. Every instant is an offset date-time in the salon's zone, to the second, +HH:MM.
    History entry {at, from (null for the placing), to, by {kind: staff|system, label (email else mobile, null for the
      system or an unknown account)}, reason|null, note|null}, oldest first.
    allowedActions: the staff action names, in the order confirm, release, arrive, start, cancel, no-show, undo-no-show,
      that the caller's permission reaches on this booking and the state machine allows now.
    Problem codes added to ErrorCode and the contract: slot_taken, slot_unavailable, hold_expired, rules_not_set.
      slot_unavailable and invalid_state carry a detail naming the rule (ApplicationProblemException.withDetail, new).
    Refusal order of a placement: 403 -> 400 fields (Idempotency-Key, memberId, serviceId, variantId format, date, time,
      customer.name, customer.mobile, channel) -> repeat of a key (same booking 201, or 422 request_rejected for another
      body, or 404 if no longer shown) -> 409 rules_not_set -> 404 member/service -> 400 variantId (or 404 for an
      unknown variant) -> 409 slot_unavailable (performs, five-minute step, past, more than a year ahead, closed, opening
      hours, working time; in that order) -> 409 slot_taken.
    In-process (booking.inprocess, unused until F08/F10): BookingPayments.begin/settle/abandon(bookingId, byStaff|null),
      BookingCheckout.complete(bookingId, byStaff). Event booking.BookingConfirmed.v1 {bookingId, memberId, serviceId}.

    OVERLAP MECHANISM (for docs/engineering/backend.md, "Booking integrity")
    booking_appointment.occupied is a tstzmultirange of the segments that occupy the professional (active and buffer;
    processing left out), adjacent ones merged, half-open. Constraint booking_appointment_no_overlap:
      EXCLUDE USING gist (tenant_id WITH =, member_id WITH =, occupied WITH &&)
      WHERE (state IN ('held','pending_payment','confirmed','arrived','in_service','completed')).
    Extension btree_gist (trusted; created by the owning role in V32). A hold past its expiry is still 'held' in the row,
    so the placing transaction, and an undone no-show's, first ends that professional's run-out holds over the time
    (state 'expired', history by system, audit), flushes, then inserts. Only SQLSTATE 23P01 on
    booking_appointment_no_overlap is translated, to slot_taken. The pre-insert checks never look at other bookings.

    GUARD-WINDOW MECHANISM (decision 094(f))
    shared.persistence.TransactionLocks.hold(purpose, subject): pg_advisory_xact_lock(hashtextextended(
    "<purpose>/<salon id>/<subject id>", 0)), refused outside a writable transaction. Purposes are constants on the
    declaring interfaces: UpcomingMemberBookings.GUARD_LOCK = "staff.member-bookings" (keyed by member) and
    UpcomingServiceBookings.GUARD_LOCK = "catalogue.service-bookings" (keyed by service).
      - Placing a hold, and undoing a no-show: lock member, then service, then check again, joining the transaction,
        that the service is listed (CatalogueListings) and the member is on the team and performs it (TeamMembers).
      - staff remove member: after the identity lock, lock member, ask countFor again inside the transaction.
      - staff save that takes services away: after the identity lock, lock member, ask servicesBookedFor again.
      - catalogue delete service: after the version check, lock service, ask anyFor again.
    The pre-transaction questions are kept, for the answer before any transaction. Booking's contract answers open their
    own REQUIRES_NEW read transaction, as their Javadoc says, so the second ask holds a second connection while the
    lock is held (rare admin actions; a pool exhausted by holds waiting on the same lock makes it 503 after 2 s, it never
    deadlocks).

    DIFFERENCES FROM docs/ AND CHOICES FOR THE LEAD TO RECORD
    1. Tables booking_appointment and booking_state_change (backend.md's example name is booking_hold).
    2. A released or expired hold is kept as a row with an internal state 'released' or 'expired' (never shown, 404,
       occupying nothing), so its history entry exists; nothing is deleted. The job "removes" a hold by ending it.
    3. Confirming (or starting a payment for) a hold past its expiry is hold_expired whether or not the job has ended it;
       every other action and read on it is 404. Releasing such a hold is 404.
    4. Architecture rule extended (ModuleRules.DECLARED_FOR_ANOTHER_MODULE, fixture declaredforanother): a @Service may
       implement the five interfaces staff and catalogue declared for booking; any other module's interface is still
       refused. The rule had no room for decision 087's pattern at the root package.
    5. shared.web.ApplicationProblemException gained withDetail(sentence) for slot_unavailable and invalid_state details.
    6. salon.booking.phone-region is booking's own setting (backend.md names only salon.branding.phone-region).
    7. Names are copied onto the booking when placed (member_name, service_name, variant_name) so lists need no read of
       another module per row; a later rename does not change existing bookings.
    8. Idempotency key unique per salon; the fingerprint is SHA-256 of the fields as sent; a repeat answers the booking as
       it is now (404 once no longer shown). 422 request_rejected as the spec says, not the existing idempotency_conflict.
    9. Variant rules: a service without variants refuses any variantId (400); with variants, none or another of the salon's
       services' variants is 400 (found by reading each listed service's current terms, on that refusal only, at most 300);
       any other id 404. A catalogue lookup of a variant's service would be cheaper.
    10. A granted (IAM-08) Professional reads every booking but arrive/start on another's is 404, as the spec's wording;
        403 might read better since the booking is visible.
    11. Upcoming (guards) = held not run out, pending payment, confirmed, arrived, in service, whose end has not passed.
        "Most booked" counts confirmed, arrived, in service, completed starting at or after the moment (future included).
        BookingsOnDate and MemberBookingsAffected list held, pending payment, confirmed, arrived, in service.
    12. Abandoning a payment returns the hold with its original expiry, so it may have run out at once.
    13. The hold lasts 10 minutes (a constant in the entity until S02). The job ends at most 500 holds per salon per run,
        skipping rows a placement has locked.
    14. Audit actions: booking.hold_placed, .confirmed, .hold_released, .hold_expired, .arrived, .service_started,
        .cancelled (reason in the entry), .no_show_marked, .no_show_undone, .payment_started, .payment_settled,
        .payment_abandoned, .completed; subject booking_appointment; system actor id "booking".
    15. Permissions booking.manage and booking.attend are in identity's StaffRole (there is no permission table);
        calendar.read was already in the support read set.
    16. Guard re-asks open a second connection while the lock is held (see the mechanism above).

