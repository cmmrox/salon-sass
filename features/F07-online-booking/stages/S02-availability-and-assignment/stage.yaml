    FINAL ENDPOINT SHAPES (salon host; booking module, OpenAPI tag booking)
    GET /api/v1/bookings/availability?serviceId=&variantId=&date=&memberId= (booking.manage) -> 200 Availability
      {date "YYYY-MM-DD", times: [AvailableTime {time "HH:MM", startsAt offset date-time +HH:MM, member: AvailableMember
      {id, name}}], reason: "closed"|"nobody_performs"|"not_working"|"fully_booked"|null}. memberId left out or empty is
      No preference. Refusals in order: 403 (permission first) -> 400 fields (serviceId required, variantId, memberId,
      date: format, before today, more than a year ahead) -> 409 rules_not_set -> 404 service -> 400/404 variant (as a
      hold) -> 404 member (unknown, another salon's, removed) -> 409 slot_unavailable (does not perform).
    GET /api/v1/bookings/open-days?from=&to= (booking.manage) -> 200 OpenDays {days: [date]}; 400 on from (missing,
      malformed, before today) and to (missing, malformed, before from, more than 400 days both included).
    POST /api/v1/bookings: PlaceBooking.memberId is now optional and nullable (["string","null"]); null or left out is
      No preference. The answer is the Booking as in S01, member being the one assigned. With No preference: 409
      slot_unavailable with detail "The salon is closed on that date." / "...outside the salon's opening hours." /
      "Nobody on the team performs this service." / "Nobody who performs this service works at that time."; 409
      slot_taken when everyone who works then is taken (or the constraint refused each one tried).
    Booking rules: BookingRulesInput gains holdMinutes (5, 10, 15, 20, 30) and noPreference ("least_booked" |
      "most_booked"), both optional; BookingRules (settings) gains both, required; the public read's rules are a new
      schema PublicBookingRuleTerms = the eight F04 rules + holdMinutes (no noPreference); BookingRulesHistoryEntry
      changedFields may name holdMinutes and noPreference.
    Provided interface booking.Availability (root package): freeTimes(Query{serviceId, variantId, date, memberId|null,
      audience STAFF|CUSTOMER}) -> Answer{date, times: [FreeTime{time, startsAt, memberId, memberName}], reason Empty
      (CLOSED, NOBODY_PERFORMS, NOT_WORKING, FULLY_BOOKED, OUTSIDE_BOOKING_WINDOW)}; openDays(from, to). Its Javadoc states
      the audience rules for F09, F10 and F15. Root enum booking.NoPreference; BookingTerms gains holdMinutes and
      noPreference.
    Data: V33 adds booking_rules_version.hold_minutes (int, default 10, check 5/10/15/20/30) and no_preference (text,
      default least_booked, check), and booking_appointment.assigned (boolean, default false, not in any response).

    DIFFERENCES FROM docs/ AND CHOICES FOR THE LEAD TO RECORD
    1. memberId left out of a hold is No preference, like null (the spec says null); the schema no longer requires it. A
       client that forgets it now gets an assigned booking, not a 400.
    2. holdMinutes and noPreference may be left out of a save, which keeps the current version's (10 and least_booked on
       a first save), so a client written before them cannot reset them; a value sent is checked strictly.
    3. The public booking rules read gains holdMinutes under a new schema name (PublicBookingRuleTerms) so that
       noPreference stays out of it; the settings read keeps the BookingRules schema with both.
    4. In the history and RuleChanges.FIELDS the two new names sit after bookingHorizonDays (the form's order), so a first
       version's changedFields now lists ten names.
    5. booking_appointment.assigned is added in V33, the same migration as the two rule columns (the spec says "one
       migration adds the two rule columns"); it is not returned by any endpoint. F13 reads it.
    6. Availability answers 409 rules_not_set for a salon that never saved rules (no interval or strategy to use); the
       spec does not list it.
    7. Staff times today are strictly after now; a hold (S01) still accepts a start equal to now.
    8. A local start the clocks skip is not offered; in the repeated hour a start is offered once, at its earlier
       instant (SalonTime's rule).
    9. "Booked that day" is the minutes the professional's live bookings and unexpired holds occupy within that local
       date (active and buffer, completed included, processing not); ties go to the Team page's order (name order,
       TeamMembers.performing).
    10. fully_booked also covers "someone works but no whole booking fits" (a window shorter than the service, or
        today's remaining times past); not_working is only "no working window at all".
    11. A No preference hold tries only those the calculation finds free at that start, in order, each in its own
        transaction; a candidate who left the team or the service between the read and the lock is skipped. The
        guard locks and the exclusion constraint are S01's, unchanged.
    12. Customer audience: a date before today or beyond the horizon is Empty.OUTSIDE_BOOKING_WINDOW (domain only);
        whether a professional is shown online is not considered (F15's to filter), as the Javadoc says.
    13. Open days are bounded to 400 days from today on, with no one-year cap of their own (the spec gives none).
    14. docs/engineering/backend.md ("Provided interfaces", "Booking integrity") could name booking.Availability, the
        hold length from the rules version, and the assigned column.
    15. RuleSelect (features/booking) gained an optional description rendered as FieldDescription and tied by
        aria-describedby. New test ids: rules-hold, rules-hold-option-<5|10|15|20|30>, rules-hold-help,
        rules-no-preference, rules-no-preference-option-<least_booked|most_booked>, rules-no-preference-help.
    16. BookingTestBase.template keeps /bookings/availability and /bookings/open-days out of the /bookings/{id} template.
    17. For QA (not changed by me, it is under qa/): the F04-S04 API tests compare whole rule objects with toEqual
        (settings and public) and a first version's changedFields; they will now see holdMinutes (and noPreference in
        settings) and the two new names. qa/shared/booking-rules.ts and the F05 public-rules expectations likewise.
    18. Machine notes: the walk's sign-in in a browser needs the web started with the instance's key files; a TOTP
        code is refused when reused within its 30-second step.

