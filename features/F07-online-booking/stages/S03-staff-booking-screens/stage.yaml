    DIFFERENCES FROM docs/ AND CHOICES FOR THE LEAD TO RECORD
    1. Decision 111 (the lead's rulings): no strategy sentence, "Each time shows who would take it."; History "who" is
       the staff label, "A team member" for an unknown account, "System"; never "You"; Bookings after Account, before
       Team.
    2. "Now" and "today" are the API's: a BFF read booking-clock answers GET /api/v1/meta's time; the page reads it once
       on load and keeps the offset (half the round trip), so the countdown and today follow the server, not the browser.
       At zero the sheet asks the API for the booking: 404 or not held says it ran out; still held asks again every 2 s.
    3. The mobile check: @salon/format gains a separate entry @salon/format/mobile (isMobileNumber, libphonenumber-js's
       mobile metadata; no new dependency), so only screens that check a mobile load it. The region is read by the web
       server from SALON_BOOKING_PHONE_REGION, else SALON_BRANDING_PHONE_REGION, else LK (the web read neither before;
       docs/operations/environments-and-releases.md names them for the API only). A name of 1 or over 60 characters
       says the same "Add the customer’s name.".
    4. Words the spec does not give (new strings, prototype tone): refusals on New appointment for slot_unavailable
       ("That time can no longer be booked. Choose another."), not_found ("The service or professional has changed.
       Choose them again."), permission, support, salon read-only, offline and other failures; on the appointment sheet
       not_found ("This booking is no longer on the list. A hold may have run out or been released."), slot_taken on
       undo ("That time has been booked since, so the no-show stays."), permission, support, salon read-only, offline,
       failed; the page's refused and unavailable states; "There are no services to book yet. Add them on the Services
       page."; "The salon is not open on any day in the next year. Set its opening hours in Settings."; the countdown's
       announcement "N minutes left on the hold."; explanations for a hold ("The desk confirms or releases this hold.")
       and a completed booking ("Completed at checkout.") from the prototype's openA; state "Pending" for
       pending_payment (prototype); channel labels App (customer_app), Shared link (shared_app_link), Workspace
       (staff_web); history verbs from the prototype (Held, Confirmed, Marked arrived, Service started, Marked no-show,
       No-show undone, Cancelled; Payment started, Payment not completed, Completed for F08/F10's changes); the Account
       page's labels for booking.manage and booking.attend.
    5. Explanations follow the prototype's mapping: "The booking is completed at checkout …" only for in service; none
       for a confirmed booking once a no-show is possible; "A no-show can be undone today only." while undo is allowed.
    6. The appointment sheet never offers Confirm (the spec's list has none; a hold is confirmed in New appointment);
       Release closes the sheet, every other change keeps it open and reads it again.
    7. A read-only salon (overdue invoices) is treated like a support session: no New appointment, no actions, the
       notice (the spec is silent; every other workspace screen does this).
    8. Not built from the prototype: the wide page's closing line ("Held times are kept … Payment, rescheduling and the
       calendar arrive in later features."); the narrow heading's "N bookings" without the day and "+ New" (the spec's
       wording is used at every width).
    9. Page size 50 (the API's default); the heading counts every page. Today is a shortcut shown only on another day.
    10. Changing any field of New appointment while a time is held releases the hold. A started form (name or mobile
        typed) asks before the sheet closes; LeaveDialog gains the area new-appointment.
    11. A page rendered without the principal (an expired access credential) renews in the browser and refreshes, as
        AccountScreen does; a hold is released with a keepalive request, falling back to the locked request.
    12. The professional filter lists every team member (team-members), New appointment only those who perform the
        service (by service or whole category, as staff counts them).
    13. Radix Select ignores keys while its list is opening (about 0.2 s): a keyboard choice works, a script needs a
        short wait after Enter. Existing screens behave the same.

