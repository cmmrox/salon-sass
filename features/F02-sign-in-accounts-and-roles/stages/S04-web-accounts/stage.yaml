ith no Origin, with a foreign Origin or with cross-site Fetch Metadata got 403 and the session stayed valid; with an exact Origin it got 200.\n- AC-8: 288 width checks (every compared screen, both builds, six widths) with no horizontal overflow. No interactive element under 44x44 on sign-in at six widths, or on account, staff and audit at 360 and 1440 for three roles in three salons (60 checks). axe (WCAG 2.2 AA tags) 24 runs, 0 violations. Errors are role=alert. Sign-in tab order: identifier, password, toggle, recovery, sign-in. With the API stopped, sign-in and the account screen each showed the translated alert 'We could not reach the service. Your entries are kept.' with entries kept, and both recovered once the API was back (sign-in reached the account; Retry reloaded the devices). The stopped API refused connections at once; the frozen-API three-second budget (BUG-F02-012) was not re-exercised, and lib/api is unchanged.\n- AC-9: sign-in pixel-identical to the pre-CR-016 build at all six widths in all three salons, across the initial, recovery, refused, challenge and enrolment states; the password toggle switches type with aria-pressed and a translated label; no workspace rail or header on sign-in.\n- AC-10: measured on sign-in and workspace for alpha (#D6086A, white text), beta (#1F2937, white) and gamma (#FDE68A, ink #111827): --primary and --accent read the brand and its 22-alpha tint; the sign-in action, initial ring, field focus ring, workspace primary button and selected rail item are the brand; gamma's recovery text is ink with a brand underline, alpha's and beta's is the brand; the phone tab is the soft tint with ink; the focus outline stays #1D5FD0, 3px; Poppins is loaded. beta changed to #0F766E showed on both screens on the next request with no rebuild, then was restored.\n- AC-11: signed out, on all three salons, /, /workspace, /workspace/account, /staff and /audit (and legacy /sign-in and /account) are server 307s to sign-in; the first painted screencast frame after about:blank is the sign-in card with the salon's name and initial. Signed in, the documents carry the salon name with no app-name and no account-loading card, and the first frame is the workspace with only the device list pending in its card (.local/output/playwright/cr016-f02/walk/sheet-entry-*.png).\n- AC-12: rendered data-slots on the running screens: sign-in alert, avatar, button, card, input, label; staff card, native-select, checkbox, button, input, label; audit card, button. Confirmation (36 opens, both builds): bottom sheet at 360 and 390, a centred 430px sheet at 768, a 460px full-height right drawer from 1024; initial focus on Cancel in 36/36; Tab and Shift+Tab cycle only Cancel and Confirm with the page inert behind it; Escape, backdrop and Cancel close it and return focus to the opener (36/36 in a timed probe on both builds). Difference to report: Radix restores focus in a timer after the sheet unmounts, so for a moment after closing (under 100ms, seen after a screenshot was taken while the sheet was open) focus can be on <body> before it reaches the opener; the old native dialog restored it synchronously. QA's toBeFocused retries and passes; the primitive's own behaviour was kept rather than worked around.\n- AC-13: all of the above. Test ids, translations and states unchanged.\n\nObservation for the lead (pre-existing, not CR-016, identical on 8716a3e): alpha's staff cookies sent by hand to beta's host (all cookies, or the access cookie alone) get 200 with beta's branded workspace frame and no principal, list or alpha data, and the BFF answers 401. lib/identity/entry.ts returns pending when renewal() cannot call the family spent, so this is the CR-013 known limit. A browser cannot send them, because they are host-only. QA may want to look at it at the feature pass.\n\nDocs for the lead: web.md Styling could note that a confirmation is the ui Sheet with side bottom plus rail: drawer classes, and that the shadcn Checkbox replaces native checkboxes. The theme's input text size is the Tailwind name text-field (lib/utils.ts lists the theme names for tailwind-merge, and must be kept in step with globals.css). The new theme size is --size-sheet-max-height (90vh).\n\nDeveloper gates on 858cac3 (checkout above, Node 24.12.0, Corepack pnpm 12.11.2, JDK25 from the build; logs in .local/logs/; revision in .local/logs/f02s04-cr016-gates-revision.txt):\n- cd apps/api && ./mvnw -q verify: EXIT 0, 518 tests, 0 failures, 0 errors, 0 skipped, run alone with the local API stopped (Testcontainers), .local/logs/f02s04-cr016-maven.log.\n- pnpm -r lint: EXIT 0, .local/logs/f02s04-cr016-lint.log.\n- pnpm -r typecheck: EXIT 0, .local/logs/f02s04-cr016-typecheck.log.\n- pnpm -r test: EXIT 0, 19 contracts and 423 web tests (39 files), .local/logs/f02s04-cr016-tests.log.\n- pnpm --filter @salon/web build: EXIT 0 with the web stopped, .local/logs/f02s04-cr016-web-build.log.\n- pnpm contracts:check: EXIT 0, current, .local/logs/f02s04-cr016-contracts.log.\n\nNot done or not checked: rate-limit lockout, cross-tab renewal and replay revocation, and the frozen-API budget were not re-exercised (unchanged code, see above). No staging, deployment or push.\n\nTimings: the interrupted session's implementation time is unknown. This session: review and refinements about 10 minutes, gates about 6 minutes, walkthrough and comparison about 45 minutes, including about 10 minutes diagnosing the focus timing and the self-demotion fixture step.\n\nbug-fix F02 2026-10-17 BUG-F02-013, fix c618f87 on charithm/bugfix/F02-brand-foreground-contrast, checkout /Users/cmmrox/Personal/Projects/salon-sass. contrastColour(): white or ink #111827 as before when the better one reaches 4.5:1, otherwise #000000 (ON_BRAND_COLOURS.black); brandTextColour already falls back to ink on white (17.7:1), so no gap there. Red first: brand.test.ts sweep of the RGB cube at step 5 (140,608 colours) plus #808080 and #C34BB4 failed (9,364 colours below 4.5:1; .local/logs/bug-f02-013-before.log), now passing; a further case proves every colour where white or ink reached 4.5:1 keeps the previous choice. Running product: alpha set with local-salon.sh colour to #808080 then #C34BB4: sign-in action, workspace primary button and selected navigation black text at 5.32:1 and 4.99:1 (were ink 4.49 and white 4.21); alpha restored to #D6086A, white 5.12:1 (.local/logs/bug-f02-013-after-runtime.log). Gates on c618f87, logs .local/logs/bug013-*.log: pnpm -r lint EXIT0; pnpm -r typecheck EXIT0; pnpm -r test EXIT0 (19 contracts, 391 web); pnpm --filter @salon/web build EXIT0; pnpm contracts:check EXIT0; cd apps/api && ./mvnw -q verify first run EXIT1 on a timing assertion only: SalonEndpointDatabaseSilentIntegrationTest had two requests at 5.077 s and 5.075 s against a 5 s limit while the database was frozen (Java unchanged; this suite passed three times earlier today; .local/logs/bug013-maven-run1-flaky.log); rerun EXIT0, 518 tests, 0 failures (bug013-maven.log). The lead may want that margin examined separately. API and web restarted from this build. Fixture MANAGERs re-seeded idempotently.\n\nbug-fix F02 2026-10-17 BUG-F02-012, fix 881ca87 on charithm/bugfix/F02-sign-in-frozen-api-deadline, checkout /Users/cmmrox/Personal/Projects/salon-sass. Root cause: requestSignal() deadlines reached the outgoing socket only through openapi-fetch, withTraceparent and transport copies of the Request; undici copies follow their parent signal through a weakly held controller, so a GC while the API was silent dropped the abort and the call waited for the API to resume (intermittent, predates CR-013). Fix: withTraceparent enforces the shared request budget with a strong timer (remainingBudget) and passes its signal explicitly; fetchForHostname uses init.signal as given; the caller's original signal is forwarded. Red first: lib/api/deadline.test.ts (stand-in API silent, headers-only, unread; hostname transport, platform fetch, handleIdentity sign-in; caller abort) 11/11 failing with forced GC, all passing without GC (.local/logs/bug-f02-012-before.log), now 11/11 passing. Running product: API frozen with SIGSTOP plus static-file load on the web: pre-fix web gave no answer in 30 s 3/3 (.local/logs/bug-f02-012-repro-prefix.log); fixed web 503 in about 3.0 s 7/7 (bug-f02-012-after-runtime.log, bug-f02-012-final-runtime.log); API always resumed; normal sign-in, renewal and logout re-checked. Gates on 881ca87, logs .local/logs/bug012-*.log: mvnw -q verify EXIT0 (518 tests; API stopped then restarted); pnpm -r lint EXIT0; pnpm -r typecheck EXIT0; pnpm -r test EXIT0 (19 contracts, 386 web); pnpm --filter @salon/web build EXIT0 (web stopped then restarted); pnpm contracts:check EXIT0. Fixture: synthetic MANAGERs re-seeded idempotently after QA's identity reset (private .local/cr013-dev-fixture.json).\n\nbug-fix F02 2026-10-17 (BUG-F02-010, BUG-F02-011), fix 3b8df96 on charithm/bugfix/F02-cr013-entry-cookies-default-brand, checkout /Users/cmmrox/Personal/Projects/salon-sass. Red first: 7 failing unit cases (.local/logs/bug-f02-010-011-before.log), now passing. Running product: BUG-011 reproduced on the pre-fix 756fdef web, then fixed on the rebuilt 3b8df96 web (307 to sign-in with six host-only clearing Set-Cookie headers; no staff cookies left; renewal and logout entry unchanged); BUG-010 through a stand-in API :8091 and a second web :3101 (invalid, injection and missing colour render sign-in 200 in #D6086A; stand-ins stopped). Gates on 3b8df96, logs .local/logs/bugfix-f02-*.log: mvnw -q verify EXIT0 (518 tests, API stopped then restarted); pnpm -r lint EXIT0; pnpm -r typecheck EXIT0; pnpm -r test EXIT0 (19 contracts, 375 web); pnpm --filter @salon/web build EXIT0 (web stopped then restarted); pnpm contracts:check EXIT0. Fixture: the three synthetic MANAGERs were re-seeded idempotently after QA's identity reset (same private .local/cr013-dev-fixture.json). Earlier CR-013 handoff follows.\n\nCR-013 developer handoff 2026-10-17, tested source 756fdef9a5b29d23cd74daf4000f56db07311d4c (tree clean; this handoff commit changes only stage metadata).\n\nAC-10 checked on the running product (Playwright from outside, .local/output/playwright/cr013/observations-theme.json, screenshots *-sign-in-1440/390.png and *-account-1440/390.png). One shared theme, with prototype tokens canvas F3F0EB, secondary EAE5DC, lines DDD6CA, white cards, ink 111827 and muted 6B7280. Every salon screen gets its brand from a style rule built from the API colour (BrandStyle via salonBrandRule): --color-brand, --color-on-brand, --color-brand-soft and --color-brand-text. alpha D6086A (default), beta 1F2937 (dark) and gamma FDE68A (light) were each measured on sign-in and workspace. The sign-in action fill and its border, the initial ring, the field inset focus, the workspace primary button, the selected desktop rail item and the field inset focus all equal the brand. Text on brand fills is white for alpha and beta and ink for gamma. The recovery link is the brand colour for alpha and beta, and ink with a brand underline for gamma, because gamma is under 4.5:1 on white. The phone selected tab is the brand soft tint behind the icon, with ink text. The global :focus-visible outline stays the prototype blue 1D5FD0, as the lead agreed. Sign-in card text is ink, help text is muted on a measured card pixel of rgb 252,251,250 (about 4.65:1), and card and field lines are DDD6CA. Changing the colour without a rebuild: local-salon.sh colour beta 0F766E changed both beta screens on the next request, and was then restored. A salon without a valid colour gets D6086A: the DB CHECK and strict web resolution keep an invalid colour from reaching a screen, so this is covered by the salonBrandRule and AccountFrame unit tests. Retired tokens: --color-login-ink, -muted, -accent, -action, -field, -border and -input-border, and --color-primary. --color-login-card is renamed --color-surface-translucent, and the size, space and type login tokens are kept. theme.test.ts asserts the token values, that no raw colour appears in a component module, and the accent mapping. The width matrix (360, 390, 768, 1024, 1280 and 1440) on beta and gamma covered sign-in and the account, staff and audit pages: 48 checks with no horizontal overflow.\n\nAC-11 checked on the running product (.local/output/playwright/cr013/observations-entry.json, screencast frames frames-*/ and sheet-entry.png). Signed out, on alpha, beta and gamma, every one of /, /workspace, /workspace/account, /workspace/staff and /workspace/audit is answered by server 307s straight to /workspace/sign-in, and the first painted frame is the sign-in screen. Revoked or stale cookies reach sign-in the same way: the proxy checks the session with the API before rendering. Signed in, the documents for /, /workspace, account, staff and audit render the workspace shell with the salon name in server HTML. They contain no app-name, no account-loading card and no unsupported-browser warning, and the first screencast frame is that workspace. The only pending state is the in-section list skeleton, account-list-loading (\"Loading...\"), inside the branded workspace. An expired access cookie with a live refresh family renders the salon workspace and renews under the browser lock: verified, the family rotated and the device list loaded. After logout, revisiting reaches sign-in by 307.\n\nDesign: a page redirect() under cacheComponents streams as a client meta redirect after the shell, so entry is decided in proxy.ts (routeRequest) with real 307s. /workspace is decided on cookie presence alone, with no API call. Protected pages call the API with workspaceEntry: /identity/me, plus /meta only when renewal is possible, inside the same request's three-second deadline. The page re-checks with the same function, so a signed-in protected page load now makes one extra /identity/me call within that budget. Renewal is never performed on the server, so Web Locks coordination and replay revocation are unchanged. The shared renewal() helper replaces the identical inline check in handleIdentity. (workspace)/layout.tsx sets instant=false and AccountPage has no Suspense fallbacks, so no generic AppShell frame exists.\n\nKnown limit: when the access cookie has expired but a revoked refresh family remains, the server cannot tell whether that family is spent without spending it. That visitor sees their salon's workspace frame for a moment before the browser renewal sends them to sign-in. The frame is branded and named, not the generic one.\n\nOther changes: the unsupported-browser warning no longer flashes on first render (support is unknown until inspected; controls stay disabled until then). New test id account-list-loading and message account.listLoading. local-salon.sh colour action added at the lead's request.\n\nDocs for the lead: the README, test-plan and environments docs should name the colour hook. docs/engineering/web.md Branding could record that entry is decided in proxy.ts, with the re-check and the extra /identity/me call. ui-ux-standards could mention --color-brand-text and --color-surface-translucent.\n\nDeveloper gates (checkout above, Node 24.12.0, Corepack pnpm 12.11.2, JDK25 from the build; logs in .local/logs):\n- cd apps/api && ./mvnw -q verify: EXIT 0, 518 surefire tests and 0 failures, cr013-maven.log, run fresh with the API stopped.\n- pnpm -r lint: EXIT 0, cr013-lint.log.\n- pnpm -r typecheck: EXIT 0, cr013-typecheck.log.\n- pnpm -r test: EXIT 0, 19 contracts and 367 web tests, cr013-tests.log.\n- pnpm --filter @salon/web build: EXIT 0 with the web stopped, workspace routes dynamic, cr013-web-build.log.\n- pnpm contracts:check: EXIT 0, current, cr013-contracts.log.\nNew tests: lib/identity/entry.test.ts (mutation-checked: making every 401 pending fails 3 cases), lib/tenancy/route-request.test.ts entry cases, styles/theme.test.ts, the brand.test.ts brandTextColour and salonBrandRule cases, AccountFrame brand cases, AccountEntry.test.ts