    Conditions: local profile, the three synthetic salons, retained .local/identity-keys.properties, no clock/provider/limit override. No QA automation was run by this developer.

    Built (apps/web only; no API, contract, schema, BFF or identity-library change):
    - Components added with pnpm dlx shadcn@4.22.0 add select field input-group input-otp item badge empty pagination spinner (the CLI also wrote ui/textarea.tsx for Input Group and asked to overwrite button, input, label and separator, refused). After-add steps per web.md: cn from @/lib/utils and the cn npm package removed again; dark: classes, CLI focus rings and outline-none removed; sizes, radii and colours mapped to the theme (Select trigger and Input Group as the 48px white field with the line ring and the brand ring when focused/open; Input OTP slots as separate fields, 54px on sign-in; options and pager controls 44px+; Item rows the 24px outlined row; Badge pills with default/secondary/positive/destructive/outline; Empty a dashed 20px panel). New theme shadow --shadow-menu (Tailwind shadow-popover) for the Select list.
    - Behaviour edits in ui/ (web.md rule 3): pagination.tsx: page controls are Buttons (the lists page in place, so a link with no href would not be focusable), words come from the caller, a PaginationCurrent text marker with aria-current; spinner.tsx: decorative (aria-hidden) unless given a translated label (the CLI's role=status aria-label "Loading" literal fails the translation lint); input-otp.tsx: noScriptCSSFallback={null} so no <style> element is rendered by us (rule 4); the library itself still inserts one runtime <style id=input-otp-style> for its own input (selection/autofill rules); InputGroup takes size="login"; Input Group addon drops its padding around a button so the sign-in field stays 54px; Field's invalid state no longer recolours the label; FieldError is used with role removed in Controls (the page Alert announces the refusal; the field message is read with the field through aria-describedby).
    - Product: components/account/Controls.tsx now provides TextField (Field, FieldLabel, Input, FieldDescription, FieldError), PasswordField (Input Group with the visibility toggle; sign-in and both password-change fields), CodeField (Input OTP, six slots, digits only), ChoiceField (Select), Check (horizontal Field with Checkbox; the label is the 44px target), Denied (Alert). SignIn: FieldGroup form, Input Group password, Input OTP code with expiry and help as FieldDescription, setup key/URI as labelled outputs in Fields, setup notice and "copied" as Alerts, retry wait as an Alert, Spinner in the busy action (with its translated text, aria-busy). AccountScreen: role Badge; password change Input Groups; MFA enabled and setup notice Alerts; Input OTP at enrolment; devices, staff and audit as Items in ItemGroups with Badges (current device in the brand, role, Active/Removed); Empty for empty lists; Pagination; Select for each member's role and the create form's role; horizontal Field for the Professional grant; Separator before the create form; denied (server AccountPage and client) as Alert; the invalid-session sign-in link as Button asChild variant link. ui/native-select.tsx deleted.
    - Retired with no remaining user: --size-nav, --font-size-nav (text-nav), --shadow-navigation (shadow-tabs), --radius-nav and also --size-tab (spacing-tab, the bottom tab item height), with their tailwind-merge names.
    - Reviewed and kept, as no shadcn/ui component covers the job (please confirm or name one): the setup key and URI are plain-text <output> values (QA reads them with textContent; an Input Group with a read-only input would change that), the permissions list is a plain-text list, page and section headings, the audit entry's JSON in a <pre>, the confirmation stays the Sheet, the sign-in initial stays the Avatar.
    - Tests: account/composition.test.tsx asserts the component map on every screen (Field, Input Group, Input OTP, Select, Item/ItemGroup, Badge, Empty, Pagination, Spinner, Separator, Alert for denied, retry wait, notices); components/composition.test.tsx has no exception left (the F02-S04 allowance is removed) and fails if ui/native-select.tsx returns; Controls.test.tsx covers Field labelling/refusal/description, the password toggle, Input OTP digits-only and six slots, the Select's label, keyboard choice and focus return, option ids; StaffRole and AccountRecovery tests drive the Select with the keyboard (src/test/select.ts). src/test/setup.ts adds jsdom stand-ins for scrollIntoView, pointer capture and elementFromPoint. Negative proofs (.local/logs/f02s04-cr017-negative.log): native-select.tsx restored; Native Select imported; four OTP slots with a second alert; the denied page as a paragraph: each fails, the restored tree passes.

    New dependency: input-otp 1.5.0 (apps/web dependencies; required by shadcn/ui Input OTP, as CR-017 states). The cn package the CLI added was removed.

    Test ids (QA updates its cases at the feature pass):
    - account-staff-role and account-staff-new-role are now the Select triggers (role=combobox, labelled "Role"); open with click or Enter/Space/ArrowDown, then choose the option by role and name or by its id account-role-option-<owner|manager|receptionist|professional|accountant> (lowercase value); selectOption no longer applies. The value is the trigger's text (a translated role name). Radix renders a hidden aria-hidden native select inside the create form for form semantics; it is not the control.
    - account-code is the single real input of the Input OTP (fill() and type() work; six data-slot=input-otp-slot elements draw it); digits only, maxlength 6.
    - New: account-old-password-toggle, account-new-password-toggle (password change visibility), account-staff-role-label (role Badge on each staff row), account-staff-state (Active/Removed Badge), account-staff-list, account-devices, account-audit-list (ItemGroups), account-pagination (Pagination nav, labelled "Pages"), account-staff-separator, account-mfa-notice, account-copied (sign-in "copied" Alert).
    - Kept, different element: account-device/-staff-row/-audit-row (Item, role=listitem), account-device-current and account-role (Badge), account-devices-empty/-staff-empty/-audit-empty (Empty, text unchanged), account-page (pagination current marker, text "Page N"), account-page-previous/-next (Pagination buttons, text plus chevron), account-denied (Alert, role=alert, server and client), account-retry-wait (Alert, role=status), account-mfa-enabled (Alert), account-professional-grant (Checkbox in a horizontal Field; checkbox ids are now unique per row), account-*-error (FieldError, no role). Kept unchanged: every other id, including account-identifier, account-password, account-password-toggle, account-setup-key, account-setup-uri, account-sign-in-submit, account-confirmation and its actions.
    - New strings: account.pages "Pages".

    Acceptance criteria, checked on the running product (web production build of 0b84f53, PID 97082; API jar of 0b84f53, PID 96927) with scratch Playwright 1.64 scripts that load the qa package's Playwright and @axe-core/playwright read-only (nothing written under qa/). Evidence .local/output/playwright/f02s04-cr017/ (walk.json 800/800, walk-roles.json 12/12, screenshots per salon, screen and width):
    - AC-1: on alpha, beta and gamma a fresh OWNER (seeded without TOTP) signed in, was sent to enrolment, read the setup key, typed the code into the Input OTP (letters refused) and reached /workspace/account; a wrong password shows the page Alert, keeps the identifier and clears the password. Rate limits were not triggered (they would lock the shared salons); the retry-wait Alert is covered by the composition test.
    - AC-2: / 307 /workspace, /workspace and /workspace/account signed out 307 /workspace/sign-in, legacy /sign-in and /account 307 /workspace/sign-in.
    - AC-3 / AC-6: the Owner changed a seeded Receptionist to Professional with the Select (grant appears as a horizontal Field, success Alert), checked the grant by its label (brand fill), and changed back (grant gone, Badge "Receptionist"). MANAGER reads staff (Badges, no Select, no create form) and audit; RECEPTIONIST on /workspace/staff gets the denied Alert (role=alert) and no rows.
    - AC-4: devices with the current-device Badge in the brand, Pagination, revoke and revoke-all controls; logout then the principal BFF read answers 401. Password rotation, cross-tab renewal and replay revocation are unchanged code (no file in lib/identity changed) and were not re-exercised.
    - AC-5: customer BFF GET and POST on sign-in, principal and otp-request: 404 no-store, no Set-Cookie.
    - AC-7: staff cookies HttpOnly, SameSite, host-only, not Secure under explicit local HTTP; no token in the HTML.
    - AC-8 / AC-13 / AC-14 at 360, 390, 768, 1024, 1280, 1440 for alpha (#D6086A), beta (#1F2937, long name) and gamma (#FDE68A): sign-in, account, staff, confirmation at all six; MFA enrolment at 360/390/768/1280; audit at 360/1280: zero horizontal overflow; the Poppins weights each page uses loaded; 44px+ for every action, the password toggle, the pager, the Select options and the grant label; keyboard order identifier, password, toggle (Enter shows/hides, aria-pressed), #1D5FD0 3px outline on the toggle, the Select trigger and the active OTP slot; the Select opens with Enter, ArrowDown moves, Enter chooses, focus returns to the trigger, list inside the viewport; confirmation Sheet: focus on Cancel, bottom sheet below 900px, 460px right drawer from 900px, Escape closes and returns focus to the opener. axe (wcag2a/aa, 2.1, 2.2 aa, best-practice) on beta sign-in 360/1280, MFA enrolment 360, account, staff and audit at 360 and 1280: no violation of any impact.
    - AC-9 / AC-10: sign-in keeps the CR-012 composition (compared with docs/design/references/staff-sign-in.png: interior, initial ring, name, translucent card, headings, labelled fields, the eye toggle inside the 54px password field, recovery link, action, secure-team footer); brand fill and readable foreground on the sign-in action for the three colours; the brand ring on the focused field; no workspace frame on sign-in.
    - AC-11: signed-in documents carry the workspace shell with no account-loading card; signed-out entry is a server 307 (above).
    - AC-12: rendered data-slots checked by the walk and the composition tests; the confirmation keeps its Sheet behaviour (above).
    - Prototype: docs/design/prototype/index.html Salon mode captured at the six widths (prototype-salon-*.png); the account, staff and audit screens keep its card, field, pill and row grammar.

    Visible changes accepted by CR-017 (not regressions): password-change fields gain the visibility toggle; role and status show as Badges; rows are outlined Items; the pager has chevrons and a current-page marker; empty lists are a dashed Empty panel; MFA enabled, the setup notice and "copied" are Alerts; the busy sign-in shows a spinner; a Separator line before "Add staff account"; the role choice opens a white list (it may open upward near the bottom of the viewport).

    Left out, or for the lead:
    - No screen pixel comparison with the CR-016 build this time: CR-017 changes the look by design; the comparison is with the prototype and the CR-012 reference.
    - The walk created synthetic accounts (see handoff.data).

    Different from a document (the lead corrects the documents):
    - web.md component map: name what shows a one-time secret (here a labelled <output>), and that a Select test chooses by role/name or the option ids above.
    - web.md rule 3 list of ui behaviour edits: add Pagination (Button controls, caller words, PaginationCurrent), Spinner (decorative unless labelled), Input OTP (no noscript style; the library's own runtime style element), Input Group size/addon padding, FieldError role removed by the caller.
    - web.md rule 4 (no <style> element): input-otp inserts one runtime <style> for its input; it is the library's, not ours.
    - tech-stack.md: input-otp 1.5.0.
    - ui-ux-standards.md: the theme gains --shadow-menu; the tab-bar tokens and --size-tab are retired.

