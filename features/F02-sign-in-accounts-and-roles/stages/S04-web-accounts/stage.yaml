  notes: "CR-016 developer handoff 2026-10-17, F02-S04 stage-build (resume after a machine restart), checkout /Users/cmmrox/Personal/Projects/salon-sass, branch charithm/feature/F02-S04-cr-016-tailwind-shadcn. Tested source 858cac34e070a2672ffdd9fa8d7dd2e112c78a91 (tree clean; this handoff commit changes only stage metadata).\n\nWhat was built: the uncommitted work of the interrupted session was reviewed against AC-12/AC-13 and web.md Styling and kept. Staff sign-in, MFA enrolment and challenge, account (permissions, password, authenticator), devices, staff and audit screens and the confirmation overlay are composed from shadcn/ui Card, Alert, Button, Input, Label, NativeSelect, Checkbox, Skeleton, Avatar and Sheet with theme utilities. Account.module.css, Confirmation.module.css and StaffSignIn.module.css and the transitional legacy token block in theme.css are gone. This session added: the sheet's 90vh limit as the theme size --size-sheet-max-height (rule 5), text-small for the CLI's text-sm in ui/avatar, and components/account/composition.test.tsx (a source check that no account screen writes a raw button, input, select, textarea, table or dialog element, which fails on the pre-CR-016 Controls.tsx, plus rendered data-slot checks for each screen). Staff and audit lists remain the existing row cards and status words remain text: CR-016 keeps every screen's look, and neither screen showed a table or badge before.\n\nTest ids, translations and states: unchanged; no test id renamed or removed. No new dependency: the ui components use radix-ui, lucide-react, class-variance-authority and tailwind-merge already installed by F01-S03. New ui files: avatar, checkbox, input, label, native-select, sheet (alert and button gained variants). lib/utils.ts extends tailwind-merge with the theme's Tailwind names (lib/utils.test.ts). The theme's input font size is now the Tailwind name text-field (the variable --font-size-input is unchanged), so it cannot be mistaken for a colour.\n\nReference-to-product comparison: the pre-CR-016 build (8716a3e, CSS Modules, QA-passed under CR-012/CR-013) on :3101 against the rebuilt product on :3100, one browser session for both so the data is identical. Every screen and state (sign-in, sign-in with recovery guidance, refused sign-in, MFA challenge, Owner MFA enrolment at sign-in with the key masked, account and devices, staff with Owner controls, audit, confirmation overlay) for alpha, beta and gamma at 360, 390, 768, 1024, 1280 and 1440: 162 screenshot pairs, 156 pixel-identical. The 6 that differ are alpha's staff page at each width, only in a 24x24px box: the Professional grant checkbox is now the shadcn/ui Checkbox (24px, brand fill, readable check, same place) where Chrome drew a native box; its corners are slightly rounder and its tick thinner (.local/output/playwright/cr016-f02/checkbox-390-ref-vs-new.png). This follows from rule 1 and is not a regression. Pairs in .local/output/playwright/cr016-f02/pairs/, results in .local/output/playwright/cr016-f02/pixel-comparison.txt. Against the prototype (Salon mode staff view and sheet, 1440 and 390) and the owner's staff-sign-in.png at 1536x1024: same grammar and composition (.local/output/playwright/cr016-f02/walk/compare-proto-*.png, compare-reference-sign-in.png); the only departure is the brand colour replacing the mockup's taupe, as CR-013 requires.\n\nAcceptance criteria, each checked on the running product from outside (Playwright from .local/output/playwright/cr016-f02/scripts, results in .local/output/playwright/cr016-f02/walk-*.log and compare-*.log):\n- AC-1: on alpha, beta and gamma an unenrolled Owner signing in is sent to enrolment (only challenge cookies exist before verification); a wrong code gives the translated role=alert refusal and stays on the code step; a valid code reaches /workspace/account with MFA enabled. A receptionist enrolled voluntarily from the account screen and was then asked for a code at the next sign-in. A wrong password