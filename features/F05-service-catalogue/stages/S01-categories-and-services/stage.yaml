verification:
  commands:
  - cd apps/api && ./mvnw -q verify
  - pnpm -r lint
  - pnpm -r typecheck
  - pnpm -r test
  - pnpm --filter @salon/web test:a11y
  - pnpm --filter @salon/web build
  - pnpm contracts:check
  automation:
  - id: catalogue-api
    tool: playwright
    file: qa/api/F05/S01-catalogue.spec.ts
    project: api
    suites: [regression]
  - id: services-screens
    tool: playwright
    file: qa/web/F05/S01-services-screens.spec.ts
    project: web
    suites: [regression]
  - id: category-backfill
    tool: script
    file: qa/checks/F05/S01-category-backfill.sh
    suites: [regression]
  manual: []
  deferred:
  - case: TC-F05-S01-020
    covers: [AC-9]
    reason: A delete refused with 409 in_use, and the screen's "This service has upcoming bookings.
      Hide it from online booking instead.", need an upcoming booking that uses the service. No
      booking exists before F07, and until booking implements UpcomingServiceBookings the
      catalogue's own implementation answers "none" (decision 093). The spec has the developer's
      integration test, with an implementation that reports a booking, prove the refusal. From
      outside, TC-F05-S01-019 and TC-F05-S01-035 show delete when no booking uses the service.
    unblocked_by: F07, when booking implements UpcomingServiceBookings and a booking can use a service.
  - case: TC-F05-S01-047
    covers: [AC-3]
    reason: A salon in another currency is told its price limits in rupees (BUG-F05-001, minor, the
      wording only; amounts are stored and shown correctly). The check is written when the bug is
      fixed, as what the message should say in another currency is not yet decided.
    unblocked_by: BUG-F05-001
