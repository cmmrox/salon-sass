handoff:
  run: |
    Local, from the repository root, in a plain (non-login) shell, on a fresh database so the owner's `salon` database
    keeps its data: `docker exec salon-postgres psql -U salon -d postgres -c "CREATE DATABASE <name> OWNER salon"`, then
    `SALON_DB_NAME=<name> infra/scripts/local-service.sh start api` and `... start web`. Migrations V1 to V27 and the local
    seed run at API start. As in F05-S01 and F05-S02 the walk-through could not use local-service.sh, because the owner's API
    (8090) and web (3100) run from this checkout: it ran the API from the compiled classes of the gates worktree (`java -cp
    <classes>:<runtime classpath> com.salonplatform.SalonApiApplication`, environment from infra/scripts/lib/common.sh
    `load_settings` with SALON_DB_NAME=f05s03_walk, SALON_API_PORT=8293) and the web as that worktree's production build
    (`node apps/web/scripts/serve.mjs --port 3293`). Screens: http://alpha.localhost:3100/workspace/settings/tax (Settings →
    Tax & charges, between Booking rules and Branding) and /workspace/services/products (the Products tab); the Services tab
    gains the tax banner. API, salon host: /api/v1/catalogue/tax (GET, public), tax/settings (GET, PUT), tax/history (GET
    ?page&size), products (GET, POST), products/{id} (PUT, DELETE ?version=). New BFF actions: catalogue-tax-settings,
    catalogue-tax-history (settings.read), catalogue-tax-save (settings.manage), catalogue-tax-public (no permission, answered
    as {current}), catalogue-products (catalogue.read), catalogue-product-add/-save/-delete (catalogue.price.change).
    New settings (salon.catalogue.tax.*), each with its environment variable: vat.name SALON_CATALOGUE_TAX_VAT_NAME (VAT),
    vat.rate-percent SALON_CATALOGUE_TAX_VAT_RATE_PERCENT (18), vat.registration-label
    SALON_CATALOGUE_TAX_VAT_REGISTRATION_LABEL (VAT registration number), service-charge.name
    SALON_CATALOGUE_TAX_SERVICE_CHARGE_NAME (Service charge), service-charge.max-percent
    SALON_CATALOGUE_TAX_SERVICE_CHARGE_MAX_PERCENT (20); documented in .env.example. For TC-F05-S03-019, start the API with
    SALON_CATALOGUE_TAX_VAT_RATE_PERCENT=<rate> in its environment: local-service.sh needs no change, as it starts the jar
    with the caller's exported environment and exports every key of .env (load_env_file). The API refuses to start with a
    rate outside 0 to 100, a maximum outside 1 to 100 or an empty name. No new local hook. Stop the services and drop the
    database afterwards.
  data: |
    No tax settings and no product are seeded: a salon has no tax version (the public read is JSON null, the settings
    version 0) and no products until it saves or adds one. The walk-through's staff (every role in alpha and beta, through
    POST /local/identity/seed), its operator Support account (/local/operator/seed), its support session, its four services
    and its products were synthetic and random, kept only in the scratchpad; its database f05s03_walk was dropped at 21:51.
  notes: |
    Built against every acceptance criterion and checked on the running product from outside, on a fresh database
    (f05s03_walk) with two synthetic salons (alpha, beta), all five roles, an operator Support account and a support session:
    API checks 58/58 (api_walk_result.json), suspended and read-only 2/2 (states_walk_result.json), browser checks on Tax &
    charges 28/28 then 27/28 on a rerun whose history check expected the first run's state (browser_walk_result_tax.json; the
    second run's newest version changed only "Service charge on products", which is right), Products and the Services tab
    34/34 (browser_walk_result_products.json), Playwright Chromium at 360, 390, 768, 1024, 1280 and 1440, the API from the
    classes of 28c8940 (apps/api main source is the same to 450c35f) and the web as the production build of 0c0b966. Evidence,
    scripts and screens: /private/tmp/claude-501/-Users-cmmrox-Personal-Projects-salon-sass/715cfef9-1213-4c28-9082-71b8eb4e4e54/scratchpad/walk3/ (api_walk.py, browser.cjs, proto.cjs, screens/). The scripts are not product code
    and were not committed.
    AC-1 checked: the tab sits between Booking rules and Branding at every width; before the first save the public read is
    the JSON literal null with no sign-in and the settings say version 0, settings null and the configured names and rates;
    the tab shows both off and the prototype's banner sentence; the Settings intro says tax saves at once.
    AC-2 checked: VAT without a number, numbers of 0 and 21 characters, a space and an accented letter are 400 on
    vat.registrationNumber; rates 0, 21, 10.5, "10" and none are 400 on serviceCharge.percent; nothing saved by any refusal;
    a 1-character number with 1% and a 20-character number with 20% on products are kept. A number or rate sent for a part
    that is off, or onProducts true with the charge off, is 400 "is not allowed while it is off" (lead's answer): the screen
    keeps what was typed when a part is turned off and on and the request leaves it out (component test and walk). The
    screen says each broken rule beside its field ("Enter the VAT registration number: 1 to 20 letters, digits and
    hyphens.", "The rate must be a whole number from 1 to 20%.") and keeps Save disabled.
    AC-3 checked: each save made the next version and made it current; version 1's row was unchanged and holds VAT 18; an
    identical save is 409 invalid_state, a stale one 409 conflict; eight saves of one version at once gave exactly one 200
    and seven 409 conflict with one version added; the history is newest first, paged (?size=101 is 400), with "You", the
    label or "A team member" and the changed settings in words; an UPDATE by the owner role is refused by the trigger. A
    configuration change (integration test with the rate at 15): the earlier version still says 18, the settings'
    configured rate is 15, the tab says "The VAT rate is now 15%. Save to apply it to new bookings and sales." (component
    and a11y tests), and a save with the same choices is version 2 at 15 whose history names only "VAT rate".
    AC-4 checked by TaxPartsTest: every price from Rs. 1 to Rs. 10,000 in Rs. 1 steps for every service charge 0 to 20%, with
    VAT 18% and without (420,000 cases), against a BigDecimal oracle; the prototype's Rs. 2,500 -> Rs. 192.60 and Rs. 381.36
    and Rs. 3,200 -> Rs. 488.14; ties rounded half to even. The shared table apps/api/src/test/resources/catalogue/
    tax-parts-cases.json (114 cases) holds both the API's TaxParts and the web preview's taxParts (tax-parts.test.ts).
    AC-5 checked: the preview priced alpha's first service bookable online in the Services tab's order (Balayage, Colour,
    before Root touch-up; the hidden Ash toner skipped) and its first product sold by name, with each part in the currency's
    cents ("Rs. 1,830.51", "Rs. 0.15"), updating as the form changed (Also on products added the product's service charge);
    the examples "A service" Rs. 2,500 and "A product" Rs. 3,200 when there are none (component test); the prototype's note.
    AC-6 checked: the public read carries the version id, VAT name and rate and the service charge with onProducts, and never
    the registration number or the word "registration"; beta's is its own (null). TaxSettings (integration tests): current,
    a version by id unchanged after three later saves, another salon's id and an unknown id empty, servicePrice and
    productPrice with the product's VAT choice and the charge on products.
    AC-7 checked: a table from 900px and cards below at every width, "N products · M sold at checkout", "VAT 18%", "No VAT",
    "—" while VAT is off (component test), Sold / Not sold badges, the empty state with + New product, the banner with "Prices
    include VAT where it applies." or "VAT is off for your salon.", no horizontal scrolling, a 40-character name wraps.
    AC-8 checked: names of 1, 41 and another product's in any case, prices 0, Rs. 500,001 and part of a rupee, VAT as text
