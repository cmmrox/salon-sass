    Fixes to earlier stages: d3d04ed fix(F05-S01), lead's clarification 8: a service card's Hide or Show online and
    Duplicate were disabled while a change ran, which dropped keyboard focus to the page. They now carry aria-disabled, are
    drawn as disabled and ignore a press until the change ends. The component test (ServicesScreen.test.tsx, "keeps keyboard
    focus on Hide online and Duplicate ...") failed first on the disabled button; on the running product focus stayed on the
    button during and after its change.
    Different from the spec or docs, or chosen where they were silent, for the lead:
    (1) Shapes: the settings read is {version, settings, configured} where settings mirrors the save's body ({vat:
    {registered, registrationNumber}, serviceCharge: {on, percent, onProducts}}, number and percent null while off); the
    version's copied VAT rate is read from the public read, so the "rate is now" notice appears only while the current
    version charges VAT. Schemas: CatalogueTax, NoCatalogueTax, CatalogueTaxVat, CatalogueTaxServiceCharge,
    CatalogueTaxSettings, CatalogueTaxValues, CatalogueTaxVatValues, CatalogueTaxServiceChargeValues, CatalogueTaxConfigured,
    SaveCatalogueTax, CatalogueTaxVatInput, CatalogueTaxServiceChargeInput, CatalogueTaxHistory, CatalogueTaxHistoryEntry,
    NewCatalogueProduct, SaveCatalogueProduct, CatalogueProduct, CatalogueProductList.
    (2) History changedFields are the API's names: vat.registered, vat.registrationNumber, vat.ratePercent, vat.name,
    serviceCharge.on, serviceCharge.percent, serviceCharge.onProducts, serviceCharge.name; the screen says them as the lead's
    names plus "VAT rate" (lead), "VAT name" and "Service charge name" (mine, for a configuration rename). A save is identical
    only when the choices and the copied names and rate are all the same.
    (3) Data: catalogue_tax_version (immutable, trigger catalogue_tax_version_refuse_update, SELECT and INSERT for the
    application role; it stores the configured VAT name and rate and the service charge's name, not the registration label
    or the maximum) and catalogue_product (current only, SELECT/INSERT/UPDATE/DELETE, unique lower(name) per branch, a
    delete removes the row). The eraser and CatalogueTenantData cover both; module-ownership.yaml lists them; the settings
    prefix salon.catalogue already covered salon.catalogue.tax, so it is unchanged.
    (4) Rates are whole percentages in configuration and in versions (Sri Lanka's 18 needs no fraction).
    (5) The 300-product limit takes the branch's category-list lock (as a new service does) without raising its list
    version; a lost race on the unique name answers 409 conflict.
    (6) An unchanged product save is 409 invalid_state, as for services and categories; the sheet keeps Save disabled until
    something changes. A product keeps the currency it was last saved in (the salon's then).
    (7) Contracts: TaxSettings (current, version, servicePrice, productPrice), TaxSettingsVersion with Vat and ServiceCharge,
    PriceParts, Products (product, soldAtCheckout) and Product in catalogue's root package, with Javadoc. The breakdown with
    no saved version is the caller's: the whole price is net. Arithmetic in domain.TaxParts.
    (8) Audit actions catalogue.tax_saved, catalogue.product_added, catalogue.product_updated, catalogue.product_deleted.
    (9) Web: formatMoney gains an option { cents: 'always' } (packages/format, tested) for the preview's parts (lead's
    clarification 1). The preview's arithmetic is in the browser, as the spec allows, held to the API by the shared case
    table, which the web test imports from apps/api/src/test/resources (one file read by both apps). TaxHistorySheet follows
    booking's RulesHistorySheet line for line (a feature cannot import another); a shared settings history sheet in
    components/shared would remove the copy. ServicesScreen now draws its tabs through a small ServicesFrame shared with the
    new ProductsScreen; LeaveDialog gains areas tax and products; ConfirmDelete gains product-delete; the proxy's protected
