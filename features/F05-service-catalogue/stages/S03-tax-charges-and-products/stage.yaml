    and charges save at once and apply to new bookings and sales. Existing bookings and sales keep the tax they were made
    under."), as are the field messages in AC-2 and "Nothing changed: these are already your tax settings.".
    (10) The products banner's "VAT is off for your salon." and the sheet's "VAT is off for your salon, so no tax is charged
