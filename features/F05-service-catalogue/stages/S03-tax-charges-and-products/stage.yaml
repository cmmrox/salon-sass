    test). Charge VAT is hidden while VAT is off and the product's choice is kept and sent.
    AC-9 checked by integration tests: Products.product(id) for the caller's salon only (another salon's id empty), a
    deleted product gone, soldAtCheckout() by name regardless of case, not sold left out.
    AC-10 checked: the Services and Products tabs show "Prices you enter include service charge (12%) and VAT (18%).
    Customers see the same price."; the VAT-only and charge-only sentences and the "off" sentence are component tests.
    AC-11 checked: Receptionist, Professional and Accountant are 403 permission_denied on settings, history, save and every
