id: F08
title: Payments, deposits and refunds
summary: A customer pays a deposit or in full through the salon's own gateway account, the booking is
  confirmed by the gateway's verified notification, and the salon can refund and issue receipts. Staff send a
  deposit payment link by WhatsApp or SMS for bookings they create (CR-023), and record a deposit paid by
  bank transfer, LANKAQR or cash (CR-028). F08 delivers staff web controls and shared backend capability;
  customers pay on the booking page (F24) and later in the app (F15).
