# Delivers the platform (F01-S05).
#
# publish: once CI has passed on a push to main, builds the API's and the web app's images with the
#   same script a developer runs (infra/scripts/images-build.sh), scans them (images-scan.sh, which
#   fails on a critical or high vulnerability with a fix) and publishes them to this repository's
#   container registry, ghcr.io/<owner>/salon-api and salon-web, tagged with the version and the
#   commit. The version is the API build's development version followed by the commit.
#
# deploy: started by hand only, with the version to deploy. Runs against the GitHub environment
#   `staging`, whose secrets name the host; copies the stack's files there and runs
#   infra/scripts/stack-deploy.sh on it, which replaces the instances one at a time without downtime.
#   It stops with a message naming each secret the environment does not have. The host's
#   administrator creates .env.stack on the host, logs its Docker in to the registry and starts the
#   stack once (infra/scripts/stack-up.sh); nothing here creates or reads a secret of the stack's own.
#
# Nothing here runs until the repository has a remote with this workflow on main, and nothing deploys
# until the environment `staging` exists with its secrets.
name: Delivery

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: The version to deploy to staging, as the publish job tagged it
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build, scan and publish the images
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    concurrency:
      group: delivery-publish
      cancel-in-progress: false
    steps:
      # The commit CI passed, not whatever main is now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Name the version and the registry
        id: names
        run: |
          revision="$(sed -n 's:.*<revision>\(.*\)</revision>.*:\1:p' apps/api/pom.xml | head -n 1)"
          commit="$(git rev-parse HEAD)"
          echo "version=${revision}-${commit:0:12}" >>"$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/" >>"$GITHUB_OUTPUT"

      - name: infra/scripts/images-build.sh
        env:
          SALON_IMAGE_PREFIX: ${{ steps.names.outputs.prefix }}
          VERSION: ${{ steps.names.outputs.version }}
        run: infra/scripts/images-build.sh "$VERSION"

      - name: infra/scripts/images-scan.sh
        env:
          SALON_IMAGE_PREFIX: ${{ steps.names.outputs.prefix }}
          SALON_VERSION: ${{ steps.names.outputs.version }}
        run: infra/scripts/images-scan.sh

      - name: Sign in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the images
        env:
          PREFIX: ${{ steps.names.outputs.prefix }}
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          commit="$(git rev-parse HEAD)"
          for image in salon-api salon-web; do
            docker push "${PREFIX}${image}:${VERSION}"
            docker push "${PREFIX}${image}:${commit:0:12}"
          done
          echo "Published ${PREFIX}salon-api and ${PREFIX}salon-web, version ${VERSION}" >>"$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to staging
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: delivery-deploy-staging
      cancel-in-progress: false
    steps:
      - name: Check the environment's secrets
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_KEY STAGING_SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::The environment 'staging' has no secret ${name}. Add it under Settings, Environments, staging, and run this job again. Nothing was deployed."
              missing=1
            fi
          done
          exit "$missing"

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error title=Not a version::'${VERSION}' is not a version. Use a version the publish job tagged."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Reach the host
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" >~/.ssh/staging
          chmod 600 ~/.ssh/staging
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" >~/.ssh/known_hosts

      - name: Copy the stack's files to the host
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          tar -czf - infra/stack infra/scripts infra/postgres .env.stack.example \
              apps/api/pom.xml apps/api/src/main/resources/db/local/afterMigrate.sql \
            | ssh -i ~/.ssh/staging -o StrictHostKeyChecking=yes "${STAGING_SSH_USER}@${STAGING_SSH_HOST}" \
                'mkdir -p salon-stack && tar -xzf - -C salon-stack'

      - name: infra/scripts/stack-deploy.sh
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          VERSION: ${{ inputs.version }}
        run: |
          ssh -i ~/.ssh/staging -o StrictHostKeyChecking=yes "${STAGING_SSH_USER}@${STAGING_SSH_HOST}" \
            "cd salon-stack && infra/scripts/stack-deploy.sh '${VERSION}'"
          echo "Deployed version ${VERSION} to staging" >>"$GITHUB_STEP_SUMMARY"
