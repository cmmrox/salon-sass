# Runs every developer gate on a pull request, in parallel jobs, and fails the pull request's check
# when any of them fails.
#
# A step that runs a stage's verification command is named with the command's own text. The jobs
# run side by side; `Verification commands`, the check main's branch protection requires, waits
# for all of them and succeeds only when every one succeeded. A new job is added to its `needs`.
#
# The API's tests run in three shards of one `./mvnw -q verify` each: shard `rest` runs every test
# class outside the packages the other two name, so a new package is tested without a change here.
# Together the shards run each test class exactly once (checked with JUnit's dry-run mode).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  web-checks:
    name: Web lint, types, format and unused code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # pnpm at the version package.json pins.
      - name: Enable Corepack
        run: corepack enable
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
      - name: pnpm -r lint
        run: pnpm -r lint
      - name: pnpm -r typecheck
        run: pnpm -r typecheck
      - name: pnpm format:check
        run: pnpm format:check
      - name: pnpm knip
        run: pnpm knip

  web-tests:
    name: Web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
      - name: pnpm -r test
        run: pnpm -r test

  web-a11y:
    name: Web accessibility check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
      # The a11y project runs in Playwright's Chromium, at the version apps/web pins.
      - name: Install Chromium for the accessibility check
        run: pnpm --filter @salon/web exec playwright install --with-deps chromium
      - name: pnpm --filter @salon/web test:a11y
        run: pnpm --filter @salon/web test:a11y

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
      - name: pnpm --filter @salon/web build
        run: pnpm --filter @salon/web build

  tooling:
    name: Lifecycle tooling, QA type-check and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # selftest runs the build-identity tests in Node.js; QA's type-check needs it too.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: qa/scripts/sdlc selftest
        run: qa/scripts/sdlc selftest
      - name: qa/scripts/sdlc validate
        run: qa/scripts/sdlc validate
      # qa/ keeps its own package and lock file, outside the product's workspace.
      - name: pnpm --dir qa install --ignore-workspace --frozen-lockfile
        run: pnpm --dir qa install --ignore-workspace --frozen-lockfile
      - name: pnpm --dir qa run typecheck
        run: pnpm --dir qa run typecheck
      - name: infra/scripts/lint-workflows.sh
        run: infra/scripts/lint-workflows.sh

  contracts:
    name: API contract check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
      # Generates the OpenAPI document from the API's controllers and compares it, and the client
      # generated from it, with the committed ones.
      - name: pnpm contracts:check
        run: pnpm contracts:check

  api:
    name: API build and tests (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: staff, branding, booking
            tests: com/salonplatform/staff/**,com/salonplatform/branding/**,com/salonplatform/booking/**
          - name: platform, identity, catalogue
            tests: com/salonplatform/platform/**,com/salonplatform/identity/**,com/salonplatform/catalogue/**
          - name: rest
            tests: >-
              !com/salonplatform/staff/**,!com/salonplatform/branding/**,!com/salonplatform/booking/**,!com/salonplatform/platform/**,!com/salonplatform/identity/**,!com/salonplatform/catalogue/**
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
      # The stage gate `cd apps/api && ./mvnw -q verify`, with this shard's test classes. The format
      # check runs first, in the validate phase.
      - name: cd apps/api && ./mvnw -q verify (${{ matrix.shard.name }})
        env:
          TESTS: ${{ matrix.shard.tests }}
        run: cd apps/api && ./mvnw -q verify "-Dtest=$TESTS" -Dsurefire.failIfNoSpecifiedTests=false

  images:
    name: Production images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Builds both production images and checks each runs as an unprivileged user and holds no
      # environment file. Docker is on the runner; Trivy and actionlint run from their images.
      - name: infra/scripts/images-build.sh
        run: infra/scripts/images-build.sh

  verify:
    # main's branch protection requires a check of exactly this name: keep it.
    name: Verification commands
    if: always()
    needs: [web-checks, web-tests, web-a11y, web-build, tooling, contracts, api, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null
