# Settings that hold in every environment. Nothing here has a local default: an environment that
# does not say where its database is must fail to start, not connect somewhere by accident.
# The local profile (application-local.yaml) supplies the values for a developer's machine.
spring:
  application:
    name: salon-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SALON_DB_URL}
    username: ${SALON_DB_USER}
    password: ${SALON_DB_PASSWORD}
    hikari:
      # With virtual threads the pool, not the thread count, is the limit. Sized deliberately.
      maximum-pool-size: 10
      # How long a request waits for a connection. It is also how quickly the health check
      # reports the database as down instead of hanging.
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        connectTimeout: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SALON_API_PORT:8090}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always

# The OpenAPI document is generated at build time and committed. The running service serves it
# only where a profile turns it on.
springdoc:
  api-docs:
    enabled: false
  paths-to-match: /api/**
  writer-with-order-by-keys: true
