# Settings that hold in every environment. Nothing here has a local default: an environment that
# does not say where its database is must fail to start, not connect somewhere by accident.
# The local profile (application-local.yaml) supplies the values for a developer's machine.
spring:
  application:
    name: salon-api
  main:
    # Every line the API writes is a JSON log line; the banner is not one.
    banner-mode: "off"
  threads:
    virtual:
      enabled: true
  # The application connects as its own role, which owns no table, is not a superuser and cannot
  # get round row-level security (docs/architecture/multi-tenancy.md, T-3). The API refuses to
  # start when the role it is given could.
  datasource:
    url: ${SALON_DB_URL}
    username: ${SALON_DB_APP_USER}
    password: ${SALON_DB_APP_PASSWORD}
    hikari:
      # With virtual threads the pool, not the thread count, is the limit. Sized deliberately.
      maximum-pool-size: 10
      # Every wait on the database has a limit, so that a database that is stopped, or that
      # accepts connections and then says nothing, costs a request seconds and never hangs it.
      #
      # How long a request waits for a connection from the pool, in milliseconds. With the
      # database stopped this is how quickly the health check reports it down.
      connection-timeout: 2000
      # How long the test that a connection is alive may take, in milliseconds: the pool's own
      # test before it hands a connection out, and the health check's query (DatabaseHealthIndicator).
      validation-timeout: 1000
      # The PostgreSQL driver's own limits, in seconds.
      data-source-properties:
        # Opening the network connection.
        connectTimeout: 2
        # Opening it and signing in, together.
        loginTimeout: 2
        # Waiting for an answer on an open connection: the longest any one statement, a migration's
        # included, may stay silent before the driver gives the connection up. A statement that is
        # merely slow should be stopped by the database long before this.
        socketTimeout: 30
  # Migrations run as the role that owns the tables, on a connection of their own to the same
  # database, with the same limits on every wait as the pool (MigrationDataSourceConfiguration).
  flyway:
    user: ${SALON_DB_USER}
    password: ${SALON_DB_PASSWORD}
    placeholders:
      # The role the migrations grant to: whichever role the application connects as.
      application_role: ${spring.datasource.username}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Times go to and from the database as UTC instants, whatever the machine's zone (the
          # API also sets the JVM's default zone to UTC when it starts: UtcTimeZone).
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  # A request body is read strictly: a value of another JSON type is never turned into the declared
  # one. A number in quotes is not a number, a decimal is not a whole number, and 1 is not true; each
  # is a validation failure that names the field (400 bad_request), as the contract's types say.
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false

server:
  port: ${SALON_API_PORT:8090}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      # Two more groups beside the full health, for whatever sends traffic to this instance (the
      # edge) and whatever restarts it: /actuator/health/readiness, which turns OUT_OF_SERVICE as
      # soon as the instance starts to stop, and /actuator/health/liveness. Each shows its status only.
      probes:
        enabled: true
      # Named here only to show the status alone; a group named in configuration includes every
      # indicator unless it says which, so each says.
      group:
        readiness:
          include: readinessState
          show-components: never
        liveness:
          include: livenessState
          show-components: never
  tracing:
    # Every request, delivery and job run is traced. Spans leave the process only when an OTLP
    # endpoint is configured (management.opentelemetry.tracing.export.otlp.endpoint); where they are
    # shipped is F01-S05's.
    sampling:
      probability: 1.0
    # A caller's W3C traceparent is continued; nothing else is read or written.
    propagation:
      type: w3c
  otlp:
    metrics:
      export:
        # Meters are read at /actuator/metrics in the local profile. Shipping them is F01-S05's.
        enabled: false

# One JSON object per line, in the Elastic Common Schema: every line carries trace.id and span.id,
# and tenant.id whenever a salon is bound (a request on its hostname, a delivery or a job run for
# it). The developer tests keep their own quiet, plain configuration (logback-test.xml).
logging:
  structured:
    format:
      console: ecs

salon:
  # Salons are served at <slug>.<platform domain>. Required: an environment that does not say
  # which domain it serves must not guess.
  platform-domain: ${SALON_PLATFORM_DOMAIN}
  database:
    # The longest a request's database work may wait for an answer on a connection it holds,
    # before the request is answered 503. Shorter than the driver's socket timeout, which is the
    # limit for everything else (migrations included).
    request-timeout: 3s
    # How often the pool asks for a new connection while the database is unreachable or silent,
    # once it has been reached. This, not the pool's own wait between attempts (which grows to five
    # seconds and cannot be set), decides how soon the API answers again after the database does
    # (SteadyReconnectDataSource). Each attempt keeps the driver's limits above.
    reconnect-interval: 250ms
  # The outbox (OutboxSettings) and the recurring jobs (JobSettings). These are the defaults, written
  # out so that they can be read in one place; tests shorten them.
  outbox:
    # Whether this instance delivers. Messages are written whatever this says.
    enabled: true
    poll-interval: 1s
    batch-size: 100
    per-salon: 20
    # How long a claim holds a message; a delivery interrupted by a stop is attempted again after it.
    lease: 60s
    max-attempts: 10
    backoff:
      initial: 30s
      multiplier: 2
      max: 1h
    provider:
      time-limit: 10s
      concurrency: 4
    breaker:
      failure-threshold: 5
      wait-duration: 60s
    # Delivered messages are kept this long, then removed by the outbox-cleanup job.
    retention: 30d
    # On stop, calls in flight are given this long to finish; what is left is recovered by its lease.
    shutdown-grace: 5s
  jobs:
    enabled: true
    poll-interval: 1s
    # How long a job stays claimed by an instance that stopped without finishing it.
    hold: 10m
    outbox-cleanup: 1h
  server:
    # How long a stopping instance keeps answering, with its readiness already OUT_OF_SERVICE, before
    # it stops taking requests (ReadinessDrain): long enough for the edge's health check, which runs
    # every second, to take it out of the rotation. Calls in flight then get the shutdown grace.
    drain-delay: 5s
    # Every network interface, as a service in a container must. The local profile listens on this
    # machine's loopback addresses only, unless SALON_LISTEN_ON_NETWORK says otherwise.
    listen-on-network: ${SALON_LISTEN_ON_NETWORK:true}

# The OpenAPI document is generated at build time and committed. The running service serves it
# only where a profile turns it on.
springdoc:
  api-docs:
    enabled: false
  paths-to-match: /api/**
  writer-with-order-by-keys: true

# No nonlocal fallback keys. Three independent 32-byte keys encoded as 64 hexadecimal characters.
salon.identity:
  signing-key: ${SALON_IDENTITY_SIGNING_KEY:}
  challenge-key: ${SALON_IDENTITY_CHALLENGE_KEY:}
  encryption-key: ${SALON_IDENTITY_ENCRYPTION_KEY:}
