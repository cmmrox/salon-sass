# A developer's machine. The database is the one infra/docker-compose.yml starts; its roles and
# passwords are local-only values and protect nothing (.env.example lists them).
spring:
  datasource:
    url: ${SALON_DB_URL:jdbc:postgresql://localhost:${SALON_POSTGRES_PORT:5440}/${SALON_DB_NAME:salon}}
    username: ${SALON_DB_APP_USER:salon_app}
    password: ${SALON_DB_APP_PASSWORD:salon-app-local-only}
  flyway:
    user: ${SALON_DB_USER:salon}
    password: ${SALON_DB_PASSWORD:salon-local-only}
    # db/local holds the seed of the three synthetic salons (docs/qa/test-plan.md). No other
    # profile adds it, so no other environment is ever seeded.
    locations: classpath:db/migration,classpath:db/local

salon:
  platform:
    datasource:
      username: ${SALON_DB_PLATFORM_USER:salon_platform}
      password: ${SALON_DB_PLATFORM_PASSWORD:salon-platform-local-only}
  identity:
    local-key-file: ${SALON_IDENTITY_LOCAL_KEY_FILE:../../.local/identity-keys.properties}
  operator:
    local-key-file: ${SALON_OPERATOR_LOCAL_KEY_FILE:../../.local/operator-keys.properties}
  billing:
    local-key-file: ${SALON_BILLING_LOCAL_KEY_FILE:../../.local/billing-keys.properties}
    link-origin: ${SALON_BILLING_LINK_ORIGIN:http://%s:3100}
  export:
    local-key-file: ${SALON_EXPORT_LOCAL_KEY_FILE:../../.local/export-keys.properties}
    link-origin: ${SALON_EXPORT_LINK_ORIGIN:http://%s:3100}
  platform-domain: ${SALON_PLATFORM_DOMAIN:localhost}
  server:
    # This machine only (CR-002). SALON_LISTEN_ON_NETWORK=true opens the ports to the network, for
    # testing from a phone on the same network.
    listen-on-network: ${SALON_LISTEN_ON_NETWORK:false}
    # Nothing routes traffic to the local API by its readiness, so it stops at once.
    drain-delay: 0s

management:
  endpoints:
    web:
      exposure:
        # The meters (/actuator/metrics) are for a developer and QA on this machine only.
        include: health,info,metrics
  info:
    java:
      enabled: true

springdoc:
  api-docs:
    enabled: true
