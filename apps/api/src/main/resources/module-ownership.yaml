# Which module owns each table, API path and setting (docs/engineering/backend.md, "Ownership of tables
# and paths"; CR-021 decision 4). Only the owning module's code and migrations touch its tables, reads its
# settings and serves its paths. A path or a setting belongs to the module with the longest matching
# prefix, compared whole segment by whole segment (decision 058): /api/v1/salon is branding's, while
# /api/v1/salon/invoices is platform's. The architecture tests hold the database, the code and the OpenAPI
# document to this file, and the OpenAPI configuration builds each module's document from it.
modules:
  identity:
    description: Staff accounts, roles and sessions, and customer one-time-code sign-in.
    tables:
      - identity_customer
      - identity_customer_challenge
      - identity_guard
      - identity_mfa_challenge
      - identity_mfa_step
      - identity_rate_bucket
      - identity_refresh_history
      - identity_session
      - identity_staff
    paths:
      - /api/v1/identity
    settings:
      - salon.identity

  branding:
    description: The salon's brand and its published presentation, its business profile and its branches.
    tables:
      - branding_brand_draft
      - branding_branch
      - branding_branch_contact_draft
      - branding_branch_contact_published
      - branding_image
      - branding_profile_draft
      - branding_profile_published
      - salon_brand
    paths:
      - /api/v1/salon
    settings:
      - salon.branding

  platform:
    description: Salons, plans, entitlements, billing, lifecycle, exports, support sessions and operators.
    tables:
      - billing_reminder
      - charge_attempt
      - invoice
      - invoice_number
      - invoice_payment
      - operator_mfa_challenge
      - operator_mfa_step
      - operator_rate_bucket
      - operator_refresh_history
      - operator_session
      - operator_user
      - plan
      - platform_audit_entry
      - platform_holiday_draft_day
      - platform_holiday_published_day
      - platform_holiday_year
      - provider_event
      - provisioning_receipt
      - salon_export
      - salon_export_part
      - salon_lifecycle_event
      - subscription
      - support_entry_code
      - support_session
      - tenant
    paths:
      - /api/v1/operator
      - /api/v1/billing
      - /api/v1/exports
      - /api/v1/support
      - /api/v1/salon/entitlements
      - /api/v1/salon/invoices
      - /api/v1/salon/support-sessions
    # Named before CR-021 and kept, because a setting's name is also its environment variable's
    # (salon.export.key is SALON_EXPORT_KEY).
    settings:
      - salon.platform
      - salon.operator
      - salon.billing
      - salon.export
      - salon.support
      - salon.retention

  staff:
    description: Each branch's opening hours, its choices for the published holidays and its special closures.
    tables:
      - staff_closure
      - staff_holiday_choice
      - staff_holiday_review
      - staff_opening_hours
    paths:
      - /api/v1/salon/opening-hours
      - /api/v1/salon/holidays
      - /api/v1/salon/closures
    settings:
      - salon.staff

  booking:
    description: The salon's booking rules and policies, each save an immutable version.
    tables:
      - booking_rules_version
    paths:
      - /api/v1/salon/booking-rules
    settings:
      - salon.booking

  catalogue:
    description: The salon's categories and services, each change of price, time, variants or deposit an immutable terms version, its Popular services, its tax settings as immutable versions, and its products.
    tables:
      - catalogue_category
      - catalogue_category_list
      - catalogue_photo
      - catalogue_popular_setting
      - catalogue_product
      - catalogue_service
      - catalogue_tax_version
      - catalogue_terms_variant
      - catalogue_terms_version
    paths:
      - /api/v1/catalogue
    settings:
      - salon.catalogue

  shared:
    description: Technical capabilities every module runs on, and the service's own metadata.
    tables:
      - audit_entry
      - outbox_message
      - scheduled_job
      - shared_processed_event
    paths:
      - /api/v1/meta
    settings:
      - salon.platform-domain
      - salon.platform.datasource
      - salon.database
      - salon.server
      - salon.outbox
      - salon.jobs
