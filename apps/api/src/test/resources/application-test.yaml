# Developer tests. The database is a PostgreSQL container started by the tests, which supply its
# address and roles; the OpenAPI document is served so that the contract test can read it.
spring:
  main:
    banner-mode: "off"

salon:
  platform-domain: localhost
  # The platform runtime role of every test container (db/test-application-role.sql).
  platform:
    datasource:
      username: salon_platform
      password: salon-platform-test
  # The tests start and stop the application many times; the one that tests the drain sets its own.
  server:
    drain-delay: 0s
    # On 127.0.0.1 only (the IPv4 loopback alone on a random port): bound to the wildcard address, the
    # server could be given a port another program already holds on 127.0.0.1, and a test connecting
    # to localhost would reach that program instead (F23-S02). The loopback tests set their own.
    listen-on-network: false
  # The tests share one database across application contexts; a dispatcher or a scheduler in each
  # would race the others. The tests that need them start an application of their own with them on.
  outbox:
    enabled: false
  jobs:
    enabled: false

springdoc:
  api-docs:
    enabled: true

# Throwaway independent keys generated for each test context; never usable runtime credentials.
salon.identity:
  signing-key: ${random.value}${random.value}
  challenge-key: ${random.value}${random.value}
  encryption-key: ${random.value}${random.value}
  proxy-key: ${random.value}${random.value}
salon.operator:
  signing-key: ${random.value}${random.value}
  challenge-key: ${random.value}${random.value}
  encryption-key: ${random.value}${random.value}
  proxy-key: ${random.value}${random.value}
  fingerprint-key: ${random.value}${random.value}
salon.billing:
  provider-key: ${random.value}${random.value}
salon.export:
  key: ${random.value}${random.value}
salon.support:
  signing-key: ${random.value}${random.value}
